<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nurse Profile · Jaslok@Home</title>
<meta name="theme-color" content="#1F6F6B">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Libre+Baskerville:wght@700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/site.css">
<style>
body{background:linear-gradient(180deg,#E6F2F0 0,#F4F9F8 280px)}
.nav{background:rgba(255,255,255,.9);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:10;backdrop-filter:blur(8px)}
.nav .wrap{display:flex;align-items:center;gap:8px;height:60px}
.brand{display:flex;align-items:center;gap:9px;text-decoration:none;color:var(--ink)}
.brand svg{width:34px;height:34px}.brand b{font-family:"Libre Baskerville",Georgia,serif;font-size:18px}
main{max-width:760px;margin:0 auto;padding:22px 16px 110px}
.hero{background:#fff;border:1px solid var(--line);border-radius:24px;box-shadow:var(--shadow);padding:26px 22px;text-align:center;position:relative;overflow:hidden}
.hero::before{content:"";position:absolute;left:0;right:0;top:0;height:86px;background:linear-gradient(120deg,#1F6F6B,#2E8B85)}
.photo{position:relative;width:132px;height:132px;border-radius:50%;margin:16px auto 10px;border:5px solid #fff;box-shadow:0 8px 24px rgba(15,60,56,.2);background:#E2F1EF;overflow:hidden;display:flex;align-items:center;justify-content:center}
.photo img{width:100%;height:100%;object-fit:cover}
.photo span{font-size:44px;font-weight:700;color:var(--accent)}
h1{margin:0;font-size:26px;letter-spacing:-.4px}
.title{color:var(--ink2);margin-top:2px}
.rating{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:10px;font-weight:600}
.rating small{color:var(--muted);font-weight:500}
.chips{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:12px}
.chip{display:inline-flex;align-items:center;gap:5px;padding:4px 11px;border-radius:999px;background:var(--accent-soft);color:var(--accent);font-size:13px;font-weight:600}
.chip.veg{background:#E8F7EC;color:#15803D}.chip.nonveg{background:#FDECEC;color:#B42318}
.diet-dot{width:12px;height:12px;border:1.5px solid currentColor;border-radius:2px;display:inline-flex;align-items:center;justify-content:center}
.diet-dot::after{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:16px}
.metric{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px 10px;text-align:center}
.metric .v{font-size:26px;font-weight:700;color:var(--accent);font-variant-numeric:tabular-nums;line-height:1.1}
.metric .l{font-size:12px;color:var(--ink2);margin-top:4px}
@media (max-width:560px){ .metrics{grid-template-columns:1fr 1fr} }
.sec{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px;margin-top:14px}
.sec h2{margin:0 0 10px;font-size:15px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted)}
.sec .chips{justify-content:flex-start;margin-top:0}
.about{white-space:pre-wrap;margin:0;color:var(--ink)}
.rev{border-top:1px solid var(--line);padding:12px 0}
.rev:first-of-type{border-top:none;padding-top:0}
.rev .h{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:14px}
.rev .h small{color:var(--muted);margin-left:auto}
.rev p{margin:6px 0 0;white-space:pre-wrap}
.ver{font-size:11.5px;font-weight:700;color:var(--ok);background:var(--ok-soft);border-radius:999px;padding:1px 8px}
.starpick{display:flex;gap:4px}
.starpick button{border:none;background:none;padding:2px;cursor:pointer}
.starpick svg{width:34px;height:34px}
.cta{position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.95);border-top:1px solid var(--line);padding:12px 16px;display:flex;justify-content:center;gap:10px;z-index:10;backdrop-filter:blur(6px)}
.cta .btn{padding:12px 20px;font-size:15.5px;border-radius:12px;flex:1;max-width:340px}
.loading{text-align:center;padding:80px 20px;color:var(--muted)}
</style>
</head>
<body>
<nav class="nav"><div class="wrap">
  <a class="brand" href="index.html"><svg viewBox="0 0 48 48" aria-hidden="true"><rect width="48" height="48" rx="12" fill="#1F6F6B"/><path d="M10 24 24 12l14 12" stroke="#fff" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M15 22v13h18V22" stroke="#fff" stroke-width="2.6" fill="none" stroke-linejoin="round"/><path d="M24 33s-5-3-5-6.4a2.6 2.6 0 0 1 5-1 2.6 2.6 0 0 1 5 1C29 30 24 33 24 33z" fill="#fff"/></svg><b>Jaslok@Home</b></a>
  <span class="spacer"></span>
  <span id="navAuth"></span>
</div></nav>
<main id="main"><div class="loading">Loading profile…</div></main>
<div class="cta hidden" id="cta"><a class="btn" href="tel:+917301900190">📞 Call</a><button class="btn primary" id="reqBtn">Request this nurse</button></div>
<div id="modal"></div><div id="toast"></div>

<script src="js/config.js"></script>
<script src="js/store.js"></script>
<script src="js/common.js"></script>
<script>
"use strict";
const $=(s,el=document)=>el.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function toast(m){ const t=$('#toast'); t.textContent=m; t.classList.add('show'); clearTimeout(toast.t); toast.t=setTimeout(()=>t.classList.remove('show'),2600); }
const slug=new URLSearchParams(location.search).get('n')||'';
let P=null;

function sinceText(iso){
  if(!/^\d{4}-\d{2}/.test(iso||'')) return '';
  const [y,m]=iso.split('-').map(Number); const now=new Date(); let months=(now.getFullYear()-y)*12+(now.getMonth()+1-m);
  const dur= months<1?'less than a month': months<12? `${months} month${months>1?'s':''}` : `${Math.floor(months/12)} year${months>=24?'s':''}${months%12?` ${months%12} month${months%12>1?'s':''}`:''}`;
  return { label:`${MON[m-1]} ${y}`, dur };
}
const list=v=> Array.isArray(v)? v.filter(Boolean) : String(v||'').split(',').map(x=>x.trim()).filter(Boolean);

async function load(){
  if(!slug){ $('#main').innerHTML='<div class="loading">No nurse selected.</div>'; return; }
  try{ await Store.init(); P=await Store.getNurseProfile(slug); }
  catch(e){ $('#main').innerHTML=`<div class="loading"><b>${esc(e.message)}</b><br><a href="index.html">Go to Jaslok@Home</a></div>`; return; }
  const me=Store.me();
  $('#navAuth').innerHTML= me ? `<a class="btn sm" href="${Store.homeFor(me.role)}">${me.role==='admin'?'Office board':'My account'}</a>` : `<a class="btn sm" href="index.html?next=${encodeURIComponent('nurse.html?n='+slug)}#login">Log in</a>`;
  document.title=`${P.name} · Jaslok@Home`;
  render();
  if(P.hasPhoto){ const src=await Store.getNursePhoto(slug); if(src) $('#photo').innerHTML=`<img src="${src}" alt="Photo of ${esc(P.name)}">`; }
}
function render(){
  const pr=P.profile||{}, m=P.metrics||{}, since=sinceText(P.since);
  const diet=String(pr.diet||''); const dietCls=/non/i.test(diet)?'nonveg':/veg|egg/i.test(diet)?'veg':'';
  const langs=list(pr.languages), skills=list(pr.skills);
  const me=P.me;
  $('#main').innerHTML=`
  <div class="hero">
    <div class="photo" id="photo"><span>${esc(P.name.split(/\s+/).map(w=>w[0]).join('').slice(0,2).toUpperCase())}</span></div>
    <h1>${esc(P.name)}</h1>
    <div class="title">${esc(pr.title||'Home-care Nurse')} · Jaslok@Home</div>
    <div class="rating">${JHStars(P.rating,20)} ${P.ratingCount?`${P.rating} <small>(${P.ratingCount} rating${P.ratingCount>1?'s':''})</small>`:'<small>No ratings yet</small>'}</div>
    <div class="chips">
      ${since?`<span class="chip">🗓 With us since ${esc(since.label)}</span>`:''}
      ${diet?`<span class="chip ${dietCls}">${dietCls?'<span class="diet-dot"></span>':''}${esc(diet)}</span>`:''}
      ${m.ongoing?`<span class="chip">On duty now</span>`:''}
    </div>
  </div>
  <div class="metrics">
    <div class="metric"><div class="v">${m.patients||0}</div><div class="l">Patients cared for</div></div>
    <div class="metric"><div class="v">${m.madeWell||0}</div><div class="l">Patients made well</div></div>
    <div class="metric"><div class="v">${m.sentHome||0}</div><div class="l">Patients sent home</div></div>
    <div class="metric"><div class="v">${since?esc(since.dur.replace(/ (\d+ months?)$/,'')):'—'}</div><div class="l">Working with us</div></div>
  </div>
  ${pr.bio?`<div class="sec"><h2>About</h2><p class="about">${esc(pr.bio)}</p></div>`:''}
  ${skills.length?`<div class="sec"><h2>Specialised skills</h2><div class="chips">${skills.map(x=>`<span class="chip">${esc(x)}</span>`).join('')}</div></div>`:''}
  ${langs.length?`<div class="sec"><h2>Languages</h2><div class="chips">${langs.map(x=>`<span class="chip">${esc(x)}</span>`).join('')}</div></div>`:''}
  ${pr.qualification?`<div class="sec"><h2>Qualifications</h2><p class="about">${esc(pr.qualification)}</p></div>`:''}
  <div class="sec" id="reviews"><h2>Patient reviews</h2>
    ${P.reviews.length?P.reviews.map(r=>`<div class="rev"><div class="h">${JHStars(r.rating,15)} <b>${esc(r.by)}</b>${r.verified?'<span class="ver">✓ Cared for by this nurse</span>':''}<small>${new Date(r.at).toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'})}</small></div><p>${esc(r.comment)}</p></div>`).join(''):'<p class="muted" style="margin:0">No written reviews yet.</p>'}
    <div style="border-top:1px solid var(--line);margin-top:12px;padding-top:14px" id="rateBox">${rateBox(me)}</div>
  </div>`;
  $('#cta').classList.remove('hidden');
  bindRate();
}
function rateBox(me){
  if(!me) return `<b>Were you cared for by ${esc(P.name.split(' ')[0])}?</b><p class="muted" style="margin:4px 0 10px">Only patients with a Jaslok@Home account can rate and review.</p>
    <a class="btn" href="index.html?next=${encodeURIComponent('nurse.html?n='+slug)}#login">Log in to rate</a> <a class="btn ghost" href="index.html?next=${encodeURIComponent('nurse.html?n='+slug)}#signup">Create an account</a>`;
  if(me.role!=='patient') return `<p class="muted" style="margin:0">Only patient accounts can rate nurses.</p>`;
  const r=me.myReview||{};
  return `<b>${r.rating?'Your review':'Rate '+esc(P.name.split(' ')[0])}</b>${r.hidden?' <small class="muted">(hidden by the office)</small>':''}
    <form id="rateF" class="stack" style="margin-top:8px"><div class="starpick" role="radiogroup" aria-label="Rating">${[1,2,3,4,5].map(i=>`<button type="button" data-star="${i}" aria-label="${i} star${i>1?'s':''}"></button>`).join('')}</div>
    <textarea class="in" name="c" maxlength="1000" placeholder="What was the care like? (optional)">${esc(r.comment||'')}</textarea>
    <div class="msg"></div><button class="btn primary">${r.rating?'Update review':'Submit review'}</button></form>`;
}
function bindRate(){
  const f=$('#rateF'); if(!f) return; let val=(P.me.myReview||{}).rating||0;
  const paint=()=>f.querySelectorAll('[data-star]').forEach(b=>{ const i=+b.dataset.star; b.innerHTML=`<svg viewBox="0 0 24 24"><path fill="${i<=val?'#F5A524':'#D9E2E0'}" d="M12 2.5l2.9 6.1 6.6.8-4.9 4.6 1.3 6.6L12 17.3l-5.9 3.3 1.3-6.6L2.5 9.4l6.6-.8z"/></svg>`; });
  paint(); f.addEventListener('click',e=>{ const b=e.target.closest('[data-star]'); if(b){ val=+b.dataset.star; paint(); } });
  f.addEventListener('submit',async e=>{ e.preventDefault(); const msg=f.querySelector('.msg'); if(!val){ msg.innerHTML='<div class="err">Choose 1 to 5 stars.</div>'; return; }
    const b=f.querySelector('button.primary'); b.disabled=true;
    try{ await Store.submitReview(slug,val,f.c.value); toast('Thank you for your review'); P=await Store.getNurseProfile(slug); const ph=$('#photo').innerHTML; render(); $('#photo').innerHTML=ph; }
    catch(err){ msg.innerHTML=`<div class="err">${esc(err.message)}</div>`; b.disabled=false; } });
}

/* request this nurse */
$('#reqBtn').addEventListener('click',()=>{
  const me=Store.me(); const pm=me&&me.role==='patient'?me:null;
  $('#modal').innerHTML=`<div class="modal-bg"><div class="modal"><button class="x" data-x>×</button><h2>Request ${esc(P.name)}</h2>
    <div class="muted" style="font-size:14px;margin-bottom:14px">Our coordinator will call you to confirm dates and availability.</div>
    <form id="reqF" class="stack" novalidate>
      <div class="grid2"><label class="f">Your name<input class="in" name="name" value="${esc(pm?pm.name:'')}" required></label>
      <label class="f">Mobile number<input class="in" name="phone" inputmode="tel" value="${esc(pm?pm.phone:'')}" required></label></div>
      <div class="grid2"><label class="f">Area / locality<input class="in" name="locality"></label><label class="f">From date<input class="in" type="date" name="startDate"></label></div>
      <label class="f">About the patient<textarea class="in" name="message" placeholder="Condition, hours of care needed…"></textarea></label>
      <div class="msg"></div><button class="btn primary" style="padding:11px">Send request</button></form></div></div>`;
  $('#reqF').addEventListener('submit',async e=>{ e.preventDefault(); const f=e.target; const b=f.querySelector('button'); b.disabled=true;
    try{ await Store.addInquiry({name:f.name.value,phone:f.phone.value,locality:f.locality.value,startDate:f.startDate.value,service:'Request for '+P.name,
        message:`Requested nurse: ${P.name}\n\n`+f.message.value, staffSlug:slug});
      $('#modal').innerHTML=''; toast('Request sent. We will call you soon.'); }
    catch(err){ f.querySelector('.msg').innerHTML=`<div class="err">${esc(err.message)}</div>`; b.disabled=false; } });
});
document.addEventListener('click',e=>{ if(e.target.closest('[data-x]')||e.target.classList.contains('modal-bg')) $('#modal').innerHTML=''; });
load();
</script>
</body>
</html>
