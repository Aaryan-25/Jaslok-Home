      <div class="field"><div class="lbl">Countdown badge<small>Show “N days remaining” this many days before End Date.</small></div><input type="number" id="s-countdownDays" min="0" max="30" value="${s.countdownDays}"></div>
      <div class="field"><div class="lbl">Default renewal length (days)</div><input type="number" id="s-renewDays" min="1" max="90" value="${s.renewDays}"></div>
    </div>

    <h2>WhatsApp</h2>
    <div class="panel">
      <div class="field"><div class="lbl">Country code<small>Added to 10-digit numbers. Spaces, brackets, hyphens and leading zeros are stripped.</small></div><input type="text" id="s-countryCode" value="${esc(s.countryCode)}"></div>
    </div>
    <h2 id="tplSec">Message templates</h2>
    <p>Type <span class="kbd">{{Column Name}}</span> or click a tag below to insert it where your cursor is. <span class="kbd">{{Today}}</span> and <span class="kbd">{{Now}}</span> also work.</p>

      <div class="pillbar">${cols.map(c=>`<button data-pill="${esc(c)}">${esc(c)}</button>`).join('')}<button data-pill="Today">Today</button></div>
      <textarea data-tf="body">${esc(tp.body)}</textarea></div>`).join('')}</div>
    <button class="btn" id="tplAdd">+ New template</button>

    <h2>App</h2>
    <div class="panel">
      <div class="field"><div class="lbl">Install as app<small>Runs in its own window, works offline.</small></div><div><button class="btn" id="sInstall">Install App</button> <span id="installNote" style="font-size:12.5px;color:var(--muted)"></span></div></div>
      <div class="field"><div class="lbl">Backup<small>Everything (cards, colours, pins, logs, notes, templates) as one file. Keys are excluded.</small></div><div class="row"><button class="btn" id="bkOut">Download backup</button><button class="btn" id="bkIn">Restore backup…</button></div></div>
      <div class="field"><div class="lbl">Reset<small>Deletes all cards and settings in this browser.</small></div><div><button class="btn danger" id="resetAll">Erase all data</button></div></div>
    </div>
  </div></div>`;
  const wb=$('#boardWrap');
  wb.querySelectorAll('[id^="s-"]').forEach(el=>el.addEventListener('change',()=>{
    const k=el.id.slice(2); let v=el.value;
    if(k==='daysInclusive') v=v==='1'; else if(['countdownDays','renewDays'].includes(k)) v=parseInt(v)||0; else v=v.trim();
    S.settings[k]=v; save(); toast('Saved');
  }));
  wb.querySelectorAll('[data-reveal]').forEach(b=>b.addEventListener('click',()=>{ const i=$('#'+b.dataset.reveal); i.type=i.type==='password'?'text':'password'; b.textContent=i.type==='password'?'Show':'Hide'; }));
  $('#geoTest').addEventListener('click',async()=>{ const out=$('#geoRes'); out.textContent='Looking up…'; S.settings.olaKey=$('#s-olaKey').value.trim();
    try{ const r=await geocode($('#geoQ').value); out.innerHTML=`<span class="status-dot ok"></span>${esc(r.src)}${r.cached?' (cached)':''}: <b>${r.lat.toFixed(5)}, ${r.lng.toFixed(5)}</b> · ${esc(r.label||'')}`; $('#geoCount').textContent=Object.keys(S.geoCache).length; }
    catch(e){ out.innerHTML=`<span class="status-dot bad"></span>${esc(e.message)}`; } });
  $('#geoClear').addEventListener('click',()=>{ S.geoCache={}; save(); $('#geoCount').textContent='0'; });
  // templates
  let lastTA=null;
  wb.addEventListener('focusin',e=>{ if(e.target.matches('.tpl textarea')) lastTA=e.target; });
  $('#tplList').addEventListener('mousedown',e=>{ if(e.target.closest('[data-pill]')) e.preventDefault(); });
  $('#tplList').addEventListener('click',e=>{
    const pill=e.target.closest('[data-pill]');
    if(pill){ const box=pill.closest('.tpl'); const ta=(lastTA&&box.contains(lastTA))?lastTA:$('textarea',box); const ins=`{{${pill.dataset.pill}}}`; const p=ta.selectionStart??ta.value.length;
      ta.value=ta.value.slice(0,p)+ins+ta.value.slice(ta.selectionEnd??p); ta.focus(); ta.selectionStart=ta.selectionEnd=p+ins.length; ta.dispatchEvent(new Event('input',{bubbles:true})); }
    const del=e.target.closest('[data-tdel]');
    if(del){ if(!del.classList.contains('armed')){ del.classList.add('armed'); del.textContent='Confirm'; return; } const id=del.closest('.tpl').dataset.tpl; S.templates=S.templates.filter(x=>x.id!==id); save(); renderSettings(); }
  });
  $('#tplList').addEventListener('input',e=>{ const box=e.target.closest('.tpl'); if(!box) return; const tp=S.templates.find(x=>x.id===box.dataset.tpl); const f=e.target.dataset.tf; if(f){ tp[f]=e.target.value; save(); } });
  $('#tplList').addEventListener('change',e=>{ const box=e.target.closest('.tpl'); if(!box) return; const tp=S.templates.find(x=>x.id===box.dataset.tpl); const f=e.target.dataset.tf; if(f){ tp[f]=e.target.value; save(); } });
  $('#tplAdd').addEventListener('click',()=>{ S.templates.push({id:uid(),cat:TPL_CATS[0],name:'New template',body:'Hello {{Patient Name}}, '}); save(); renderSettings(); setTimeout(()=>{ const tas=$$('.tpl textarea'); tas[tas.length-1].focus(); },20); });
  // app
  $('#sInstall').addEventListener('click',doInstall);
  $('#installNote').textContent = isStandalone()? 'Already running as an installed app.' : (deferredPrompt? '' : 'If the button does nothing: Chrome/Edge menu → “Install app”. iPhone Safari: Share → “Add to Home Screen”.');
  $('#bkOut').addEventListener('click',()=>{ const copy=JSON.parse(JSON.stringify(S)); copy.settings={...copy.settings,olaKey:'',sheetsUrl:''};
    const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([JSON.stringify(copy)],{type:'application/json'})); a.download=`jaslok-homecare-board-backup-${isoToday()}.json`; a.click(); });
  $('#bkIn').addEventListener('click',()=>$('#backupIn').click());
  $('#resetAll').addEventListener('click',e=>{ const b=e.currentTarget; if(!b.classList.contains('armed')){ b.classList.add('armed'); b.textContent='Click again to erase everything'; return; } S=defaultState(); S.active=S.tabs[0].id; save(); renderAll(); toast('All data erased'); });
}
$('#backupIn').addEventListener('change',async e=>{ const f=e.target.files[0]; e.target.value=''; if(!f) return;
  try{ const j=JSON.parse(await f.text()); if(!j.tabs) throw new Error('Not a board backup'); const keep={olaKey:S.settings.olaKey,sheetsUrl:S.settings.sheetsUrl}; S=Object.assign(defaultState(),j); S.settings={...defaultState().settings,...j.settings,...keep}; if(!S.tabs.find(t=>t.id===S.active)) S.active=S.tabs[0].id; save(); renderAll(); toast('Backup restored'); }
  catch(err){ toast('Restore failed: '+err.message); } });

/* ---------------- Info tab ---------------- */
function renderInfo(){
  closeDrawer(); renderDock();
  const K=s=>s.split('+').map(x=>`<span class="kbd">${x}</span>`).join(' + ');
  $('#boardWrap').innerHTML=`<div class="page"><div class="page-inner">
  <h1>How to use the board</h1>
  <p class="lead">Each spreadsheet row becomes a card, and each column becomes a tag on that card. Your data stays in this browser until you export it.</p>
  <div class="toc">${['Getting started','Cards & colours','Selecting','Filter & sort','Viewing & editing','WhatsApp','Notices','Dates & renewals','Documents','Import & export','Dashboard','Shortcuts','Data & privacy','Portal & logins','Map & nearest nurse','Attached documents','Sync & app','Nurse profiles & QR','Staff ledger'].map((x,i)=>`<a class="chip" href="#g${i}">${x}</a>`).join('')}</div>

  <h2 id="g0">1 · Getting started</h2>
  <ol><li>Click <b>Import .xlsx</b> and choose your workbook. Every sheet becomes a tab. A sheet whose name matches an existing tab (for example “Patient Data”) replaces that tab's cards.</li>
  <li>Highlighted rows in Excel arrive as coloured cards. Single highlighted cells arrive as coloured tags.</li>
  <li><b>Staff</b> and <b>Consumables</b> are blank templates. Fill them in now; the billing split and distance ranking in the next build will read from them.</li>
  <li>Work on the board. Click <b>Export .xlsx</b> at month end to get a styled workbook with every colour kept.</li></ol>

  <h2 id="g1">2 · Cards &amp; colours</h2>
  <ul><li><b>Card colour:</b> click the palette icon on a card. Pick a soft highlighter shade, or type any HEX code. The card is tinted and gets a coloured left edge. On export the whole Excel row is filled.</li>
  <li><b>Tag colour:</b> open a card (double-click) and click the palette beside any field. Use this to flag an unverified phone number, a high rate or a demise case. On export only that cell is filled.</li>
  <li><b>Pin ☆:</b> pinned cards stay at the top whatever the sort or filter.</li>
  <li><b>Card layout:</b> choose which tags show on the card face and in what order. Drag rows or use ↑ ↓. Hidden tags keep their data and still export.</li>
  <li><b>+ Add Tag:</b> in Card layout, or while editing a card. A new tag becomes a new column on every card in that tab.</li>
  <li><b>Compact / Detailed:</b> Compact shows the first three filled tags so 25 to 35 cards fit on screen. Detailed shows everything, including full remarks.</li>
  <li>A <span class="pulse" style="display:inline-block"></span> green dot means the case started on or before today and has not ended. Status shows as a badge.</li></ul>

  <h2 id="g2">3 · Selecting cards</h2>
  <table class="sc">
   <tr><td>Click</td><td>Select one card. Click it again to deselect.</td></tr>
   <tr><td>${K('Ctrl')} / ${K('⌘')} + click</td><td>Add or remove cards anywhere on the board.</td></tr>
   <tr><td>${K('Shift')} + click</td><td>Select every card between the last one you clicked and this one.</td></tr>
   <tr><td>Drag on empty space</td><td>Draw a box. Every card it touches is selected. Hold ${K('Ctrl')} to add to the current selection.</td></tr>
   <tr><td>Click empty space, or ${K('Esc')}</td><td>Clear the selection.</td></tr></table>
  <p>With two or more cards selected, a dock appears at the bottom. Use it to colour, change status, pin, export or delete them together. Delete asks for a second click.</p>
  <p>The strip at the very bottom shows SUM, AVG, MIN, MAX and COUNT for every number tag. It covers the selected cards, or all cards on screen if none are selected.</p>

  <h2 id="g3">4 · Filter, sort &amp; search</h2>
  <ul><li><b>Search</b> matches any tag: name, doctor, locality, phone, remarks.</li>
  <li><b>Colour filter</b> shows only cards (or tags) in one shade, like Excel's filter by colour.</li>
  <li><b>Column chips</b> (the row of tag names) open an Excel-style checklist of every value with counts. Untick a value to hide those cards. A blue chip means that column has a filter on it.</li>
  <li><b>Sort:</b> the default is pinned first, then highlighted, then the rest. You can also sort by any tag (A→Z, dates oldest or newest, numbers in natural order, so 2 comes before 10) or by last modified.</li>
  <li><b>Clear filters</b> resets search, colour and checklist filters together.</li></ul>

  <h2 id="g4">5 · Viewing &amp; editing</h2>
  <ul><li>Double-click a card, or press ${K('Enter')} on the focused card, to open it on the right half of the screen. It opens <b>read-only</b> so a stray keystroke cannot change a case.</li>
  <li>Click <b>Edit card</b>, or double-click a tag on the card face, to edit. Text tags suggest values already used in that column, such as doctor, service or locality names. ${K('Ctrl')} + ${K('Enter')} saves.</li>
  <li><b>Days</b> and <b>Total Amount</b> are worked out automatically when Start Date, End Date or Rate changes. The rule is Days = End − Start + 1 (inclusive) and Total = Days × Rate. You can change the rule in Settings. Past totals from your import are not rewritten unless you edit that card.</li>
  <li>Every edit, renewal, status change and WhatsApp message is stamped in the card's activity log.</li></ul>

  <h2 id="g5">6 · WhatsApp</h2>
  <ol><li>Click the WhatsApp icon on a card.</li><li>Pick a template (Staff Duty Dispatch, Patient Intake Quote, Discharge Billing Summary, Service Feedback). Placeholders like <span class="kbd">{{Patient Name}}</span> fill in from the card.</li>
  <li>Edit the preview if you need to, for example to add a landmark or gate code. This changes only this message.</li>
  <li>If a placeholder has no data on the card it is shown in red and sending is blocked until you fix it.</li>
  <li><b>Open WhatsApp</b> opens WhatsApp Web or the app with the message ready. The number is cleaned and +91 is added. You still press send in WhatsApp.</li></ol>
  <p>Edit templates in <b>Settings → Message templates</b>. Click a tag pill to insert it at the cursor.</p>

  <h2 id="g6">7 · Notices (sticky notes)</h2>
  <p>Click <b>Notice</b> to pin a banner above the cards in this tab. Wrap names in double braces to make them clickable, for example <span class="kbd">Referrals from {{Dr. Rajesh Mathur}}: call family before dispatch</span>. Clicking the pill filters the board to matching cards. Colours: yellow for handover, red for urgent, green for clearance, blue for info.</p>

  <h2 id="g7">8 · Dates, countdowns &amp; renewals</h2>
  <ul><li>Open cases (status not Closed or Demise) show <b>“N days remaining”</b> close to the End Date and <b>“Overdue”</b> after it. The warning window is set in Settings.</li>
  <li>To renew, open the card and extend the End Date by N days. Days and Total recalculate and the renewal is logged.</li>
  <li>The header clock inserts a timestamp like <span class="kbd">[05-Nov 14:03]</span> into whatever text box you are typing in. Press ${K('Ctrl')} + ${K('Shift')} + ${K('T')} or click the clock.</li></ul>

  <h2 id="g8">9 · Documents</h2>
  <p>Add a tag whose name contains “Link”, “Document” or “Drive” (for example <i>Discharge Summary Link</i>) and paste a Google Drive or other web link. The card shows <b>Open document</b>, which opens the file in the right half next to the board. Drive files must be shared as “Anyone with the link”, or you must be signed in to Google in this browser.</p>

  <h2 id="g9">10 · Import &amp; export</h2>
  <ul><li><b>Export .xlsx</b> writes every tab to one workbook. It keeps row colours, cell colours, date formats, a frozen header and AutoFilter.</li>
  <li><b>Export selected</b> (in the dock) writes only the selected cards of the current tab.</li>
  <li>Pins, activity logs and notices stay in the app; they are not written to Excel. Use <b>Settings → Download backup</b> to keep everything.</li></ul>

  <h2 id="g10">11 · Dashboard</h2>
  <p>The <b>Dashboard</b> tab summarises one data tab (Patient Data by default). It updates live whenever a card changes.</p>
  <ul><li><b>Key figures:</b> cases, unique patients, total billed, patient-days served, average and median length of a case, cases running now and past their end date, renewal share, demise cases.</li>
  <li><b>By month:</b> cases started and amount billed per month, in two separate charts.</li>
  <li><b>Services:</b> billing, cases, days, average daily rate and share of total billing for each service.</li>
  <li><b>Referring doctors</b> ranked by billing, <b>case status</b>, and <b>top localities</b>.</li>
  <li><b>Needs attention:</b> open cases that are overdue or end within 7 days. Click a name to open the card.</li>
  <li><b>Billing check:</b> cases where Total Amount does not equal Days × Rate, with the difference. These usually mean a flat-fee rental, consumables added, a discount or a wrong date.</li>
  <li><b>Data completeness:</b> how many cards have each tag filled. Read this first; a chart built on a half-empty column is only half true.</li></ul>
  <p>Tick <b>Use that tab's filters</b> to summarise only the cards you have filtered, for example one doctor or one month. <b>Export .xlsx</b> puts the dashboard first in the workbook, as tables with the full billing-check list.</p>

  <h2 id="g11">12 · Keyboard shortcuts</h2>
  <table class="sc">
   <tr><td>${K('←')} ${K('↑')} ${K('→')} ${K('↓')}</td><td>Move the focus between cards</td></tr>
   <tr><td>${K('Shift')} + arrows</td><td>Grow the selection card by card or row by row</td></tr>
   <tr><td>${K('Ctrl')} + ${K('A')}</td><td>Select every card shown</td></tr>
   <tr><td>${K('Enter')}</td><td>Open the focused card (read-only)</td></tr>
   <tr><td>${K('Esc')}</td><td>Close menu, clear selection, then close the side panel</td></tr>
   <tr><td>${K('Ctrl')} + ${K('Enter')}</td><td>Save while editing a card</td></tr>
   <tr><td>${K('Ctrl')} + ${K('Shift')} + ${K('T')}</td><td>Insert timestamp</td></tr>
   <tr><td>Double-click tab name</td><td>Rename the tab</td></tr></table>

  <h2 id="g13">13 · Portal &amp; logins</h2>
  <ul><li><b>Three kinds of login.</b> <b>Admin</b> (this board): one account, login ID <span class="kbd">admin</span>. <b>Patients</b> create their own account on the website with their mobile number. <b>Staff</b> get a Staff ID and temporary password from <b>Portal → Accounts</b> and must choose their own password the first time. Creating a staff login also creates their <b>public profile link and QR code</b> (see section 18).</li>
  <li><b>Patients see their own cases automatically:</b> every card in Patient Data whose <b>Phone</b> matches their mobile number. Link a case with a different number in <b>Portal → Accounts → Link another case</b>. Patients never receive Remarks, Staff Payout, cost or margin columns.</li>
  <li><b>Assigning a nurse:</b> type the nurse's name (exactly as on their staff account, or their Staff ID) in <b>Assigned Staff</b>. Two nurses: separate with a comma, e.g. <span class="kbd">Ravi Kumar, Priya Nair</span>. Do it on the card, in <b>Portal → Billing status</b>, or from the <b>Map</b>. The 📍 button in Billing status suggests the nearest nurse.</li>
  <li><b>Staff see</b> the cases assigned to them, with 🧭 directions to the patient's locality. Their earnings are their <b>daily rate × days worked so far</b>. In Portal settings you can hide the patient's bill and the family's phone number from staff.</li>
  <li><b>Portal → Billing status</b> sets Assigned Staff, Payment Status, Amount Paid and Staff Payout. Typing an amount paid sets the status to Paid or Part paid by itself. These are ordinary tags on the card, hidden from the card face, and export to Excel like any other column.</li>
  <li><b>Inbox</b> collects queries, feedback, staff reports, alerts and handover notes, with any attached files. Press <b>Share with staff on this case</b> on a handover note so the next nurse on that patient sees it.</li>
  <li><b>Inquiries</b> from the website form, with any prescription or report the visitor attached, wait in Portal → Inquiries. <b>Accept</b> turns one into an Enquiry card on the board.</li>
  <li><b>Notices &amp; messages:</b> a notice shows on everyone's home page; a message goes to one person (or a group) and they can reply. Both can carry attachments.</li></ul>

  <h2 id="g14">14 · Map &amp; nearest nurse</h2>
  <ul><li>The <b>Map</b> tab shows running and upcoming patients as dots, coloured by their nurse. <b style="color:#D92D20">Red</b> = no nurse assigned; grey = a name that doesn't match any staff account. Squares with initials are nurses' homes.</li>
  <li>Locations come from the <b>Locality</b> (or Address) on each card plus the <b>City</b> (set on the map or in Portal settings). Press <b>📍 Find locations</b> once; Ola Maps looks each place up and the result is saved, so it isn't looked up again.</li>
  <li>Give every nurse a <b>Home area</b> in Portal → Accounts so they appear on the map and in suggestions.</li>
  <li>Click a patient dot to see the <b>nearest nurses</b>. Free nurses (no ongoing duty) are listed first, then by distance. <b>Assign</b> replaces the current nurse; <b>+ Add</b> adds a second one. Distances are in a straight line, not by road.</li>
  <li>Cards with no locality are listed on the left of the map; click one to open it and fill in the Locality.</li></ul>

  <h2 id="g15">15 · Attached documents</h2>
  <ul><li><b>On a case:</b> open a card in Patient Data → <b>Documents</b> → choose files → pick <b>who can see it</b> (Office only, Patient, Staff, or Patient + staff) → Upload. Change who can see it at any time from the drop-down.</li>
  <li><b>Patients</b> see documents meant for them on their home page and in History. <b>Staff</b> see the ones meant for staff on their duty card.</li>
  <li><b>In messages:</b> patients, staff and the office can attach files when writing a message (📎 Attach) or a reply (📎 next to the reply box). Website visitors can attach up to 3 files to an inquiry.</li>
  <li>Allowed: photos, PDF, Word, Excel and text files, up to <b>5 MB</b> each. Large photos are shrunk automatically before upload. Click a file to open it.</li>
  <li>Files are stored in the online database. The free Supabase plan holds about 500 MB in total, roughly 1,500 photos or scanned pages. Delete old files you no longer need.</li></ul>

  <h2 id="g16">16 · Online sync &amp; the app</h2>
  <ul><li>The board is saved on this computer and in the online database. The header shows <b>✓ Synced</b> when the latest change is online. Opening the board on another computer loads the newest version. Don't edit on two computers at the same time; the last save wins.</li>
  <li>Patients' and staff accounts refresh about every 20 seconds, so a change you make here reaches them within half a minute.</li>
  <li><b>Install as an app:</b> the website, the patient/staff portal and this board can all be installed. Look for <b>⤓ Install app</b> at the top of the page, or use the browser menu → <b>Install app / Add to Home screen</b>. On iPhone: Safari → Share → <b>Add to Home Screen</b>. The app opens straight into the logged-in account.</li></ul>

  <h2 id="g17">18 · Nurse profiles, QR codes &amp; reviews</h2>
  <ul><li>Every staff login gets a <b>public profile page</b> and a <b>QR code</b> automatically, as soon as you create it. The link is random (e.g. <span class="kbd">nurse.html?n=ravi-kumar-48f46</span>), so it doesn't reveal the Staff ID used to log in.</li>
  <li><b>Fill in the profile:</b> Portal → Accounts → <b>Profile &amp; QR</b>. Add a photo (cropped to a square automatically), title, a few lines about them, specialised skills, languages, food preference (veg / non-veg), qualifications and the date they joined.</li>
  <li><b>Business card:</b> in the same window, <b>🖨 Print card</b> gives a standard 85 × 55 mm card, front (photo, name, title, office number) and back (QR code). <b>⤓ QR image</b> downloads a large PNG of the QR if your printer designs the card instead.</li>
  <li><b>What the public sees:</b> photo, name, star rating, patient reviews, skills, languages, food preference, how long they have worked with us, and these numbers:
    <ul><li><b>Patients cared for</b>: worked out from the cases they were assigned to.</li>
    <li><b>Patients made well</b>: cases whose Status is <span class="kbd">Recovered</span>. <b>Patients sent home</b>: cases whose Status is <span class="kbd">Sent home</span> or <span class="kbd">Discharged</span>. So when you close a case, set its Status to one of these. You can also type the numbers yourself in the profile; a typed number replaces the automatic count.</li></ul></li>
  <li><b>Request this nurse:</b> a button on the profile page. The request arrives in <b>Portal → Inquiries</b> marked “⭐ Requested nurse”, and Accept puts that nurse in Assigned Staff on the new card.</li>
  <li><b>Ratings and comments:</b> only someone logged in with a <b>patient account</b> can rate (1–5 stars) and comment; one review per patient per nurse, which they can update. Reviews from someone the nurse actually cared for show <b>“✓ Cared for by this nurse”</b>.</li>
  <li><b>Pulling down a review:</b> Portal → <b>Reviews</b> → <b>Hide</b>. It disappears from the profile and no longer counts in the rating; <b>Show again</b> brings it back. <b>Delete</b> removes it for good.</li>
  <li>Untick <b>Profile visible to the public</b> to take a profile offline (e.g. someone on long leave). A switched-off or deleted staff login also hides the profile.</li>
  <li>Patients can tap their nurse's name in their account to open the profile. Staff see their own QR code under Account.</li></ul>

  <h2 id="g18">19 · Staff ledger (Staff tab)</h2>
  <ul><li>The <b>Staff</b> tab now fills itself: one card per staff login, updated in real time whenever an account, a profile, a review or a Patient Data case changes. No spreadsheet import is needed.</li>
  <li><b>Kept up to date automatically:</b> Staff Name, Employee ID, Contact Number, Base Locality (home area), Daily Rate, Login status, Joined, Title, Languages, Diet, Skills, Rating, Reviews, Ongoing Duties, Current Patients, Total Duties, Days Worked, Earned, Paid Out, Pending Payout, Last Duty, <b>Duty History</b> (every case with dates, patient, service, days, earnings and payout status) and Profile Link.</li>
  <li>Change those on the staff account (Portal → Accounts / Profile &amp; QR), not on the card, because the card is refreshed from the account. Opening a linked staff card shows a note and a <b>Profile &amp; QR</b> button.</li>
  <li><b>Yours to edit:</b> Status, Department, Shift Type, Remarks and any column you add yourself are never overwritten.</li>
  <li>Existing rows are linked by Employee ID (or name) the first time, so nothing is duplicated. If a staff login is deleted, its card stays with Login = “Account deleted”, keeping the history.</li>
  <li>Earnings come from Patient Data: days worked × daily rate, and Staff Payout (Paid / Pending) set in Portal → Billing status. Use the board's filters, sorting and Excel export on the Staff tab as usual.</li>
  <li>The <b>Consumables</b> tab is still entered by hand (or imported from Excel when you have a sheet).</li></ul>

  <h2 id="g12">20 · Data &amp; privacy</h2>
  <ul><li>Cards, accounts, messages, inquiries and documents are stored in your <b>Supabase</b> database (and the board also on this computer). The website only ever talks to the database through checked functions, so the public key in the code cannot read any table directly.</li>
  <li>Each person receives only what they may see: a patient only their own cases, without internal columns; a staff member only their assigned cases; only the admin sees everything.</li>
  <li>Passwords are stored scrambled (hashed). 8 wrong passwords lock that account for 10 minutes. If you forget the admin password, reset it from the Supabase SQL editor (see README).</li>
  <li>The website code on GitHub Pages is public. Never put patient spreadsheets in the repository. Restrict the Ola Maps key to your website address in the Ola console.</li>
  <li>Still download a board backup (Settings) now and then, and keep it somewhere safe.</li></ul>

  </div></div>`;
}

/* ---------------- clock ---------------- */
function tick(){ const d=new Date(); $('#clock').textContent=`${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())} · ${pad(d.getDate())} ${MON[d.getMonth()]}`; }
setInterval(tick,1000); tick();
// re-render at midnight so countdowns stay correct
let lastDay=isoToday(); setInterval(()=>{ if(isoToday()!==lastDay){ lastDay=isoToday(); if(!S.active.startsWith('__')) renderBoard(); } },60000);

/* ---------------- PWA ---------------- */
let deferredPrompt=null;
function isStandalone(){ return matchMedia('(display-mode: standalone)').matches || navigator.standalone===true; }
addEventListener('beforeinstallprompt',e=>{ e.preventDefault(); deferredPrompt=e; $('#installBtn').classList.remove('hidden'); });
addEventListener('appinstalled',()=>{ deferredPrompt=null; $('#installBtn').classList.add('hidden'); toast('Installed'); });
async function doInstall(){ if(deferredPrompt){ deferredPrompt.prompt(); await deferredPrompt.userChoice; deferredPrompt=null; $('#installBtn').classList.add('hidden'); } else toast(isStandalone()?'Already installed':'Use your browser menu → Install app (iPhone: Share → Add to Home Screen)'); }
$('#installBtn').addEventListener('click',doInstall);
if('serviceWorker' in navigator && location.protocol.startsWith('http')){ navigator.serviceWorker.register('service-worker.js').catch(()=>{}); }

/* ---------------- boot ---------------- */
(async function boot(){
  await adminGate();
  $('#hdrLogout').addEventListener('click',adminLogout);
  await DB.open();
  const local=await DB.get('state');
  let cloud=null, cloudOk=true;
  try{ cloud=await Store.loadBoard(); }catch(e){ cloudOk=false; syncStatus('fail',e.message); }
  const useCloud = !!(cloud && cloud.state && cloud.state.tabs && (!local || !local.tabs || (cloud.savedAt||0) > (local.savedAt||0)));
  const saved = useCloud ? cloud.state : local;
  if(saved && saved.tabs){ const d=defaultState(); S=Object.assign(d,saved); S.settings={...d.settings,...saved.settings}; S.tabs.forEach(t=>{ t.filters=t.filters||{}; t.notes=t.notes||[]; t.hidden=t.hidden||[]; t.order=t.order||defaultOrder(t.columns); t.rows.forEach(r=>{ r.cellColors=r.cellColors||{}; r.log=r.log||[]; }); }); }
  if(!S.settings.olaKey && window.JH_CONFIG) S.settings.olaKey=JH_CONFIG.olaMapsKey||'';
  if(!S.active || (!S.active.startsWith('__') && !S.tabs.find(t=>t.id===S.active))) S.active=S.tabs[0].id;
  ensurePortalCols();
  renderAll();
  if(useCloud){ DB.set('state',JSON.parse(JSON.stringify(S))); syncStatus('ok'); }
  else if(cloudOk){ scheduleCloud(); flushCloud(); }   // first upload, or this device has newer changes
  Store.startPolling(20000);
})();
</script>
