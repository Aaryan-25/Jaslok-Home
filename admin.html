<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Office Board · Jaslok Homecare</title>
<meta name="theme-color" content="#2F4A3A">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>
:root{
  --bg:#FAF8F3; --surface:#FFFFFF; --ink:#1F2421; --ink2:#4A524D; --muted:#7A817C;
  --line:#E6E2D8; --line2:#D6D1C4; --accent:#1F6F6B; --accent-ink:#FFFFFF;
  --focus:#2563EB; --focus-soft:#DBEAFE; --danger:#B42318; --danger-soft:#FEE4E2;
  --ok:#16794C; --warn:#B54708; --warn-soft:#FEF0C7;
  --r:10px; --shadow:0 1px 2px rgba(30,30,20,.06),0 2px 8px rgba(30,30,20,.04);
  font-family: "Segoe UI", system-ui, -apple-system, Roboto, "Helvetica Neue", Arial, sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-size:14px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.hidden{display:none!important}

/* ---------- header ---------- */
header{display:flex;align-items:center;gap:12px;padding:8px 16px;background:var(--surface);border-bottom:1px solid var(--line);height:52px}
.brand{font-weight:700;font-size:15px;letter-spacing:.2px;white-space:nowrap}
.brand small{font-weight:500;color:var(--muted);margin-left:6px}
.spacer{flex:1}
.clock{font-variant-numeric:tabular-nums;color:var(--ink2);font-size:13px;padding:4px 10px;border:1px solid var(--line);border-radius:999px;background:var(--bg);cursor:pointer;white-space:nowrap}
.btn{border:1px solid var(--line2);background:var(--surface);border-radius:8px;padding:6px 11px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{background:#F3F0E8}
a.btn{color:inherit;text-decoration:none}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{background:#26402F}
.btn.danger{color:var(--danger);border-color:#F2C1BC}
.btn.danger.armed{background:var(--danger);color:#fff}
.btn.sm{padding:3px 8px;font-size:12.5px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.icon-btn{border:none;background:transparent;padding:4px;border-radius:6px;display:inline-flex;color:var(--muted)}
.icon-btn:hover{background:rgba(0,0,0,.06);color:var(--ink)}
svg.i{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* ---------- tabs ---------- */
nav.tabs{display:flex;align-items:flex-end;gap:2px;padding:0 16px;background:var(--surface);border-bottom:1px solid var(--line);overflow-x:auto}
.tab{padding:9px 14px 8px;border:1px solid transparent;border-bottom:none;border-radius:8px 8px 0 0;background:transparent;color:var(--ink2);display:flex;align-items:center;gap:6px;white-space:nowrap;position:relative;top:1px}
.tab:hover{background:#F6F3EC}
.tab.active{background:var(--bg);border-color:var(--line);color:var(--ink);font-weight:600}
.tab .count{font-size:11.5px;color:var(--muted);font-weight:500}
.tab .x{visibility:hidden;font-size:13px;color:var(--muted);padding:0 2px;border-radius:4px}
.tab:hover .x{visibility:visible}
.tab .x.armed{visibility:visible;color:#fff;background:var(--danger)}
.tab input{width:130px;padding:1px 4px;border:1px solid var(--focus);border-radius:4px}
.tabs .sys{margin-left:auto;display:flex;gap:2px}
.tabs .add{color:var(--muted);font-size:16px;padding:6px 10px}

/* ---------- layout ---------- */
#app{display:flex;flex-direction:column;height:100vh}
#main{flex:1;display:flex;min-height:0}
#boardWrap{flex:1;display:flex;flex-direction:column;min-width:0}
#drawer{width:50%;max-width:900px;min-width:380px;border-left:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;min-height:0}
#drawer .d-head{display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--line)}
#drawer .d-head h3{margin:0;font-size:15px;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#drawer .d-body{flex:1;overflow:auto;padding:14px}
#drawer .d-foot{padding:10px 14px;border-top:1px solid var(--line);display:flex;gap:8px;flex-wrap:wrap;align-items:center}

/* toolbar */
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 16px 6px}
.search{flex:0 1 260px;min-width:160px;border:1px solid var(--line2);border-radius:8px;padding:6px 10px;background:var(--surface)}
.search:focus,.toolbar select:focus{outline:2px solid var(--focus-soft);border-color:var(--focus)}
.toolbar select{border:1px solid var(--line2);border-radius:8px;padding:6px 8px;background:var(--surface)}
.seg{display:inline-flex;border:1px solid var(--line2);border-radius:8px;overflow:hidden}
.seg button{border:none;background:var(--surface);padding:6px 10px}
.seg button.on{background:var(--accent);color:#fff}
.colstrip{display:flex;gap:6px;padding:2px 16px 8px;overflow-x:auto;scrollbar-width:thin}
.chip{border:1px solid var(--line2);background:var(--surface);border-radius:999px;padding:3px 10px;font-size:12.5px;white-space:nowrap;color:var(--ink2);display:inline-flex;gap:5px;align-items:center}
.chip:hover{border-color:var(--ink2)}
.chip.on{background:var(--focus-soft);border-color:var(--focus);color:#1E3A8A;font-weight:600}
.chip .caret{font-size:9px;opacity:.6}

/* notes */
#notes{padding:0 16px;display:flex;flex-direction:column;gap:6px}
.note{display:flex;gap:8px;align-items:flex-start;padding:7px 10px;border-radius:8px;border:1px solid rgba(0,0,0,.07);font-size:13.5px}
.note .txt{flex:1;line-height:1.55}
.note .tp{display:inline-block;padding:0 8px;border-radius:999px;background:rgba(255,255,255,.75);border:1px solid rgba(0,0,0,.15);cursor:pointer;font-weight:600;font-size:12.5px}
.note .tp:hover{background:#fff;border-color:var(--focus)}
.note textarea{flex:1;min-height:38px;border:1px solid var(--line2);border-radius:6px;padding:4px 6px;background:#fff}
.note.n-yellow{background:#FEF9C3}.note.n-red{background:#FEE2E2}.note.n-green{background:#DCFCE7}.note.n-blue{background:#E0EDFF}

/* board */
#board{flex:1;overflow:auto;position:relative;padding:10px 16px 120px;user-select:none}
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(var(--cw,250px),1fr));gap:10px;align-items:start}
.density-detailed #grid{--cw:320px}
.empty{padding:60px 20px;text-align:center;color:var(--muted)}
.empty h2{color:var(--ink);font-size:18px;margin:0 0 6px}

.card{--rc:#FFFFFF;--rs:transparent;background:var(--rc);border:1px solid var(--line);border-left:5px solid var(--rs);border-radius:var(--r);padding:8px 10px 9px;box-shadow:var(--shadow);position:relative;cursor:default;outline:none;transition:box-shadow .08s}
.card:hover{border-color:var(--line2);border-left-color:var(--rs)}
.card.sel{box-shadow:0 0 0 2px var(--focus),var(--shadow);border-color:var(--focus);border-left-color:var(--rs)}
.card.focus{outline:2px dashed var(--focus);outline-offset:2px}
.c-head{display:flex;align-items:center;gap:4px}
.c-title{flex:1;font-weight:650;font-size:14.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.star{border:none;background:none;padding:0 2px;font-size:16px;line-height:1;color:#C9C3B4}
.star.on{color:#D97706}
.c-acts{display:flex;gap:0;opacity:.55}
.card:hover .c-acts,.card.sel .c-acts{opacity:1}
.c-badges{display:flex;flex-wrap:wrap;gap:4px;margin:4px 0 3px}
.badge{font-size:11.5px;padding:1px 8px;border-radius:999px;background:#EFECE4;color:var(--ink2);border:1px solid rgba(0,0,0,.05);white-space:nowrap}
.badge.st-active{background:#DCFCE7;color:#14532D}
.badge.st-closed{background:#EDEDED;color:#444}
.badge.st-pending{background:#FEF3C7;color:#78350F}
.badge.st-demise{background:#E5E7EB;color:#111;font-weight:600}
.badge.due{background:var(--warn-soft);color:var(--warn);font-weight:600}
.badge.over{background:var(--danger-soft);color:var(--danger);font-weight:700}
.pulse{width:8px;height:8px;border-radius:50%;background:#22C55E;box-shadow:0 0 0 0 rgba(34,197,94,.6);animation:pulse 1.8s infinite;flex:none}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(34,197,94,.55)}70%{box-shadow:0 0 0 7px rgba(34,197,94,0)}100%{box-shadow:0 0 0 0 rgba(34,197,94,0)}}
.c-fields{margin:0;display:flex;flex-direction:column;gap:2px}
.f{display:flex;gap:6px;font-size:12.8px;line-height:1.45;min-width:0}
.f dt{color:var(--muted);flex:0 0 78px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.f dd{margin:0;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink);border-radius:5px}
.f dd.hl{padding:0 6px;font-weight:600;border:1px solid rgba(0,0,0,.08)}
.density-detailed .f dd{white-space:normal;word-break:break-word}
.density-detailed .f dt{flex-basis:92px}
.link{color:#1D4ED8;text-decoration:underline;cursor:pointer}

/* sweep */
.sweep{position:absolute;border:1px solid var(--focus);background:rgba(37,99,235,.08);pointer-events:none;z-index:5}

/* bottom rails */
#mathStrip{position:sticky;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:6px 16px;font-size:12.5px;color:var(--ink2);display:flex;gap:16px;overflow-x:auto;white-space:nowrap;min-height:31px;align-items:center}
#mathStrip b{color:var(--ink)}
#mathStrip .m{display:inline-flex;gap:8px}
#dock{position:fixed;left:50%;transform:translateX(-50%);bottom:44px;background:#1F2421;color:#fff;border-radius:12px;padding:8px 10px;display:flex;align-items:center;gap:8px;box-shadow:0 8px 28px rgba(0,0,0,.25);z-index:30;flex-wrap:wrap;max-width:calc(100vw - 32px)}
#dock .btn{background:#2C332F;border-color:#3A423D;color:#fff}
#dock .btn:hover{background:#39423D}
#dock .btn.danger.armed{background:var(--danger)}
#dock select{background:#2C332F;color:#fff;border:1px solid #3A423D;border-radius:8px;padding:5px 6px}
.sw{width:20px;height:20px;border-radius:50%;border:1px solid rgba(0,0,0,.2);display:inline-block;cursor:pointer;flex:none}
#dock .sw{border-color:rgba(255,255,255,.4)}
.sw.clear{background:linear-gradient(135deg,#fff 45%,#d33 45%,#d33 55%,#fff 55%)}

/* popover */
#pop{position:fixed;z-index:50;background:var(--surface);border:1px solid var(--line2);border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.14);padding:10px;min-width:220px;max-width:340px;max-height:70vh;overflow:auto}
#pop h4{margin:0 0 8px;font-size:12px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted)}
.pal{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.pal button{border:1px solid var(--line2);border-radius:8px;padding:6px 4px;font-size:11.5px;display:flex;flex-direction:column;align-items:center;gap:4px;background:#fff}
.pal button:hover{border-color:var(--ink2)}
.pal .sw{width:22px;height:22px}
.row{display:flex;gap:6px;align-items:center}
.chk{display:flex;align-items:center;gap:8px;padding:3px 2px;font-size:13px;border-radius:5px;cursor:pointer}
.chk:hover{background:#F6F3EC}
.chk .n{margin-left:auto;color:var(--muted);font-size:12px}
.lay-item{display:flex;align-items:center;gap:6px;padding:3px 4px;border-radius:6px;background:#fff}
.lay-item.drag-over{background:var(--focus-soft)}
.lay-item .grip{cursor:grab;color:var(--muted);font-size:13px;padding:0 2px}
.lay-item label{flex:1;display:flex;gap:6px;align-items:center;cursor:pointer;font-size:13px}

/* drawer content */
.rec{display:grid;grid-template-columns:150px 1fr auto;gap:0;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.rec>div{padding:7px 10px;border-bottom:1px solid var(--line);font-size:13.5px;min-height:34px;display:flex;align-items:center}
.rec .k{color:var(--muted);background:#FBFAF6}
.rec .v{word-break:break-word}
.rec .v.hl{font-weight:600}
.rec .v input,.rec .v textarea,.rec .v select{width:100%;border:1px solid var(--line2);border-radius:6px;padding:5px 7px;background:#fff}
.rec .v textarea{min-height:60px;resize:vertical}
.rec .v input:focus,.rec .v textarea:focus{outline:2px solid var(--focus-soft);border-color:var(--focus)}
.rec .c{padding:0 8px;background:#FBFAF6}
.ro-flag{display:inline-flex;gap:6px;align-items:center;font-size:12px;color:var(--muted);background:#F3F0E8;border-radius:999px;padding:2px 10px}
.section-h{font-size:12px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);margin:18px 0 8px}
.log{font-size:12.5px;color:var(--ink2);border-left:2px solid var(--line2);padding-left:10px;display:flex;flex-direction:column;gap:3px}
textarea.msg{width:100%;min-height:200px;border:1px solid var(--line2);border-radius:8px;padding:10px;line-height:1.5;background:#fff}
.miss{background:var(--danger-soft);color:var(--danger);border:1px solid #F5B5AE;border-radius:999px;padding:1px 8px;font-size:12px;font-weight:600}
.warnbox{background:var(--danger-soft);color:var(--danger);border-radius:8px;padding:8px 10px;font-size:13px;margin:8px 0}
.infobox{background:#F3F0E8;border-radius:8px;padding:8px 10px;font-size:13px;color:var(--ink2);margin:8px 0}
.pillbar{display:flex;flex-wrap:wrap;gap:5px;margin:6px 0}
.pillbar button{border:1px solid #BFD3FB;background:#EEF4FF;color:#1E3A8A;border-radius:999px;padding:2px 9px;font-size:12px}
.pillbar button:hover{background:#DCE8FF}
iframe.doc{width:100%;height:100%;border:none;background:#f4f4f4}
img.doc{max-width:100%;display:block;margin:auto}

/* pages (info/settings) */
.page{flex:1;overflow:auto;padding:24px 16px 80px}
.page-inner{max-width:880px;margin:0 auto}
.page h1{font-size:22px;margin:0 0 4px}
.page h2{font-size:16px;margin:28px 0 8px;padding-top:8px;border-top:1px solid var(--line)}
.page p,.page li{line-height:1.6;color:var(--ink2)}
.page .lead{color:var(--muted);margin:0 0 12px}
.kbd{display:inline-block;border:1px solid var(--line2);border-bottom-width:2px;border-radius:5px;padding:0 6px;font-size:12px;background:#fff;font-family:ui-monospace,Consolas,monospace;color:var(--ink)}
table.sc{border-collapse:collapse;width:100%;font-size:13.5px}
table.sc td{border-bottom:1px solid var(--line);padding:7px 8px;vertical-align:top}
table.sc td:first-child{white-space:nowrap;width:220px}
.toc{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin:10px 0}
.field{display:grid;grid-template-columns:220px 1fr;gap:10px;align-items:center;padding:8px 0;border-bottom:1px dashed var(--line)}
.field:last-child{border-bottom:none}
.field .lbl{font-weight:600;font-size:13.5px}
.field .lbl small{display:block;font-weight:400;color:var(--muted);font-size:12px;margin-top:2px}
.field input[type=text],.field input[type=password],.field input[type=number],.field input[type=url],.field select{border:1px solid var(--line2);border-radius:8px;padding:7px 9px;background:#fff;width:100%}
.keyrow{display:flex;gap:6px}
.keyrow input{flex:1}
.status-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#CBD5E1;margin-right:6px}
.status-dot.ok{background:#22C55E}.status-dot.bad{background:#EF4444}
.tpl{border:1px solid var(--line);border-radius:10px;padding:10px;margin:8px 0;background:#fff}
.tpl .row input,.tpl .row select{border:1px solid var(--line2);border-radius:6px;padding:5px 8px}
.tpl textarea{width:100%;min-height:90px;border:1px solid var(--line2);border-radius:6px;padding:8px;margin-top:6px}
.phase{display:inline-block;font-size:11px;font-weight:700;padding:1px 7px;border-radius:999px;background:#E0EDFF;color:#1E3A8A;vertical-align:middle;margin-left:6px}


/* dashboard */
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px;margin:14px 0}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.kpi .kl{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px}
.kpi .kv{font-size:26px;font-weight:700;margin-top:4px;font-variant-numeric:tabular-nums}
.kpi .ks{font-size:12.5px;color:var(--ink2);margin-top:2px}
.neg{color:var(--danger)}.pos{color:var(--ok)}
.dgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(380px,1fr));gap:12px;margin:12px 0}
.dgrid.inner{margin:0}
.dcard{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin:12px 0;min-width:0}
.dgrid>.dcard{margin:0}
.dcard h3{margin:0 0 12px;font-size:14.5px}
.note2{font-size:12.5px;color:var(--muted);margin-top:10px;line-height:1.5}
.bars{display:flex;flex-direction:column;gap:5px}
.bar-row{display:grid;grid-template-columns:minmax(90px,38%) 1fr auto;gap:8px;align-items:center;font-size:12.8px;padding:1px 2px;border-radius:4px}
.bar-row:hover{background:#F6F3EC}
.bl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bl.muted{color:var(--muted);font-style:italic}
.bt{height:12px;background:transparent;display:block}
.bf{display:block;height:100%;background:#3D6B52;border-radius:0 4px 4px 0;min-width:2px}
.bf.dim{background:#B9C7BE}
.bv{font-variant-numeric:tabular-nums;color:var(--ink);min-width:56px;text-align:right}
.cols{display:flex;align-items:flex-end;gap:6px;height:190px;padding-top:4px}
.col{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;min-width:0}
.col:hover .cf{background:#2F4A3A}
.cv{font-size:11.5px;color:var(--ink2);white-space:nowrap;font-variant-numeric:tabular-nums}
.cbar{flex:1;width:100%;max-width:46px;display:flex;align-items:flex-end;border-bottom:1px solid var(--line2)}
.cf{display:block;width:100%;background:#3D6B52;border-radius:4px 4px 0 0}
.cl{font-size:11.5px;color:var(--muted);white-space:nowrap}
.tblwrap{overflow-x:auto}
table.dt{border-collapse:collapse;width:100%;font-size:12.8px}
table.dt th{text-align:left;font-weight:600;color:var(--muted);font-size:11.5px;text-transform:uppercase;letter-spacing:.3px;border-bottom:1px solid var(--line2);padding:6px 8px;white-space:nowrap}
table.dt td{border-bottom:1px solid var(--line);padding:6px 8px;font-variant-numeric:tabular-nums}
table.dt tr.muted td{color:var(--muted);font-style:italic}
@media (max-width:760px){ .dgrid{grid-template-columns:1fr} .kpi .kv{font-size:22px} }

.dash-controls{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:12px}
.hero{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:22px 24px 16px;box-shadow:var(--shadow)}
.hero-top{display:flex;gap:24px;align-items:flex-end;justify-content:space-between;flex-wrap:wrap}
.hero-text{flex:1 1 380px;min-width:0}
.eyebrow{font-size:12px;letter-spacing:.8px;text-transform:uppercase;color:#3D6B52;font-weight:700}
.hero-title{font-size:30px;line-height:1.2;margin:6px 0 6px;letter-spacing:-.3px}
.hero-sub{color:var(--ink2);font-size:14px}
.spark{flex:0 1 420px;min-width:260px}
.spark{display:flex;gap:6px;align-items:flex-end;height:118px;flex-wrap:wrap;align-content:flex-end}
.sp-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;height:96px;min-width:0}
.sp-v{font-size:10.5px;color:var(--ink2);white-space:nowrap;font-variant-numeric:tabular-nums}
.sp-b{flex:1;width:100%;max-width:34px;display:flex;align-items:flex-end;border-bottom:1px solid var(--line2)}
.sp-b span{display:block;width:100%;background:#3D6B52;border-radius:4px 4px 0 0}
.sp-col.partial .sp-b span{background:repeating-linear-gradient(135deg,#9DB8A8 0 4px,#C8D8CE 4px 8px)}
.sp-l{font-size:11px;color:var(--muted)}
.sp-cap{width:100%;font-size:11px;color:var(--muted);text-align:right;margin-top:2px}
.hkpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:0;margin:20px 0 6px;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.hk{padding:16px 18px 14px;border-left:1px solid var(--line)}
.hk:first-child{border-left:none;padding-left:0}
.hk-l{font-size:12.5px;color:var(--muted);font-weight:600}
.hk-v{font-size:36px;font-weight:750;letter-spacing:-.5px;margin:2px 0;font-variant-numeric:tabular-nums;color:var(--ink)}

   Jaslok Homecare — office board (admin login required)
   Data lives in IndexedDB on this device. Nothing is sent anywhere
   except: wa.me links you click, and geocoding tests you run in Settings.
   ===================================================================== */

const PRESETS = [
  ['Soft Yellow','#FEF3C7'],['Soft Red','#FEE2E2'],['Soft Green','#DCFCE7'],['Soft Blue','#EFF6FF'],
  ['Soft Purple','#F3E8FF'],['Soft Orange','#FFEDD5'],['Neutral White','#FFFFFF']
];
const PATIENT_COLS = ['Source','Patient Name','Doctor','Service','Locality','Phone','Start Date','End Date','Days','Rate','Total Amount','Case Type','Status','Remarks'];
const STAFF_COLS = ['Staff Name','Employee ID','Department','Contact Number','Base Locality','Shift Type','Daily Rate','Status','Remarks'];
const CONS_COLS = ['Item Name','Category','Unit','Procurement Cost','Retail Rate','Stock','Remarks'];
const CLOSED_RX = /closed|complete|demise|death|deceased|cancel|discharged|expired/i;
const NOT_RUNNING_RX = /not availed|not converted|enquiry|inquiry|lost|rejected/i;
// A case counts as running if its status says so, or if status is blank and it ended less than 30 days ago.
function isOpenCase(st,left){
  if(CLOSED_RX.test(st) || NOT_RUNNING_RX.test(st)) return false;
  if(/active|ongoing|running|renew|pending|hold/i.test(st)) return true;
  return !st && left >= -30;
}
const TPL_CATS = ['Staff Duty Dispatch','Patient Intake Quote','Discharge Billing Summary','Service Feedback'];

const DEFAULT_TEMPLATES = [
  {id:uid(), cat:'Staff Duty Dispatch', name:'Duty assignment', body:'Hello, you are assigned to {{Patient Name}} ({{Service}}) at {{Locality}} from {{Start Date}}.\nReferring doctor: {{Doctor}}.\nFamily contact: {{Phone}}.\nPlease confirm on reaching.'},
  {id:uid(), cat:'Patient Intake Quote', name:'Service quote', body:'Dear family of {{Patient Name}},\nThank you for choosing our homecare service. Quote for {{Service}}: Rs {{Rate}} per day.\nStart date: {{Start Date}}. Please reply to confirm.'},
  {id:uid(), cat:'Discharge Billing Summary', name:'Final bill', body:'Dear family of {{Patient Name}},\nService: {{Service}}\nPeriod: {{Start Date}} to {{End Date}} ({{Days}} days)\nRate: Rs {{Rate}} per day\nTotal: Rs {{Total Amount}}\nThank you.'},
  {id:uid(), cat:'Service Feedback', name:'Feedback request', body:'Dear family of {{Patient Name}},\nWe hope the {{Service}} met your needs. Could you share a quick rating out of 5 and any suggestions? It helps us improve.'}
];

/* ---------------- utils ---------------- */
function uid(){ return Math.random().toString(36).slice(2,10) + Date.now().toString(36).slice(-4); }
const $ = (s,el=document)=>el.querySelector(s);
const $$ = (s,el=document)=>[...el.querySelectorAll(s)];
function esc(s){ return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function pad(n){ return String(n).padStart(2,'0'); }
function isoToday(){ const d=new Date(); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; }
function isISO(s){ return typeof s==='string' && /^\d{4}-\d{2}-\d{2}$/.test(s); }
function dayNum(iso){ const [y,m,d]=iso.split('-').map(Number); return Date.UTC(y,m-1,d)/86400000; }
function isoAdd(iso,n){ const t=new Date((dayNum(iso)+n)*86400000); return `${t.getUTCFullYear()}-${pad(t.getUTCMonth()+1)}-${pad(t.getUTCDate())}`; }
const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function fmtDate(iso){ if(!isISO(iso)) return iso; const [y,m,d]=iso.split('-'); return `${d} ${MON[+m-1]} ${y}`; }
function nowStamp(){ const d=new Date(); return `${pad(d.getDate())}-${MON[d.getMonth()]} ${pad(d.getHours())}:${pad(d.getMinutes())}`; }
function hhmm(){ const d=new Date(); return `${pad(d.getHours())}:${pad(d.getMinutes())}`; }
function num(v){ if(v===null||v===undefined||v==='') return null; if(typeof v==='number') return v; const n=Number(String(v).replace(/[,₹\s]/g,'')); return isFinite(n)?n:null; }
const collator = new Intl.Collator('en',{numeric:true,sensitivity:'base'});
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(toast._t); toast._t=setTimeout(()=>t.classList.remove('show'),2200); }
function darker(hex){ // strip colour from a soft fill
  const h=hex.replace('#',''); if(h.length!==6) return '#999';
  let r=parseInt(h.slice(0,2),16)/255,g=parseInt(h.slice(2,4),16)/255,b=parseInt(h.slice(4,6),16)/255;
  const mx=Math.max(r,g,b),mn=Math.min(r,g,b); let H=0,S=0,L=(mx+mn)/2;
  if(mx!==mn){const d=mx-mn;S=L>.5?d/(2-mx-mn):d/(mx+mn);H=mx===r?(g-b)/d+(g<b?6:0):mx===g?(b-r)/d+2:(r-g)/d+4;H/=6;}
  if(S<0.05) return '#B8B2A3';
  S=Math.min(1,Math.max(S,.55)); L=.52;
  const q=L<.5?L*(1+S):L+S-L*S,p=2*L-q;
  const f=t=>{t<0&&(t+=1);t>1&&(t-=1);return t<1/6?p+(q-p)*6*t:t<1/2?q:t<2/3?p+(q-p)*(2/3-t)*6:p;};
  return '#'+[f(H+1/3),f(H),f(H-1/3)].map(x=>Math.round(x*255).toString(16).padStart(2,'0')).join('');
}
function colorName(hex){ const p=PRESETS.find(p=>p[1].toUpperCase()===String(hex).toUpperCase()); return p?p[0]:hex; }

  doc:'<svg class="i" viewBox="0 0 24 24"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M14 3v6h6"/></svg>',
  close:'<svg class="i" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>',

};

/* ---------------- storage (IndexedDB, falls back to memory) ---------------- */
const DB = {
  db:null,
  open(){ return new Promise(res=>{ try{ const r=indexedDB.open('homecare-board',1);
      r.onupgradeneeded=()=>{ r.result.createObjectStore('kv'); };
      r.onsuccess=()=>{ this.db=r.result; res(true); }; r.onerror=()=>res(false);
    }catch(e){ res(false); } }); },
  get(k){ return new Promise(res=>{ if(!this.db) return res(null); try{ const q=this.db.transaction('kv').objectStore('kv').get(k); q.onsuccess=()=>res(q.result??null); q.onerror=()=>res(null);}catch(e){res(null);} }); },
  set(k,v){ return new Promise(res=>{ if(!this.db) return res(false); try{ const t=this.db.transaction('kv','readwrite'); t.objectStore('kv').put(v,k); t.oncomplete=()=>res(true); t.onerror=()=>res(false);}catch(e){res(false);} }); }
};
let saveT=null;
function save(){ S.savedAt=Date.now(); clearTimeout(saveT); saveT=setTimeout(()=>DB.set('state',JSON.parse(JSON.stringify(S))),250); scheduleCloud(); }

/* ---------------- state ---------------- */
function mkTab(name, cols, rows=[]){
  return { id:uid(), name, columns:[...cols], order:defaultOrder(cols), hidden:[], rows, notes:[], filters:{}, colorFilter:null, sort:'priority', search:'' };
}
function defaultOrder(cols){
  const prio=['Service','Doctor','Locality','Phone','Contact Number','Start Date','End Date','Days','Rate','Total Amount','Status','Case Type','Department','Base Locality','Shift Type','Daily Rate','Category','Procurement Cost','Retail Rate'];
  const p=prio.filter(c=>cols.includes(c));
  return [...p, ...cols.filter(c=>!p.includes(c))];
}
function defaultState(){

    tabs:[ mkTab('Patient Data',PATIENT_COLS), mkTab('Staff',STAFF_COLS), mkTab('Consumables',CONS_COLS) ],

    templates: DEFAULT_TEMPLATES.map(t=>({...t})),

}
let S = defaultState();
S.active = S.tabs[0].id;

/* view-only state */
const V = { sel:new Set(), anchor:null, focus:null, view:[], drawer:null, popFor:null };

function tab(){ return S.tabs.find(t=>t.id===S.active); }
function rowById(t,id){ return t.rows.find(r=>r.id===id); }
function mkRow(cells={}){ return { id:uid(), cells, rowColor:null, cellColors:{}, pinned:false, log:[], modified:Date.now() }; }

/* column roles */
function findCol(t, rx){ return t.columns.find(c=>rx.test(c)); }
function roles(t){
  return {
    name: findCol(t,/patient name|staff name|item name|^name$/i) || t.columns.find(c=>/name/i.test(c)) || t.columns[0],
    start: findCol(t,/start date/i), end: findCol(t,/end date/i),
    days: findCol(t,/^(total )?days$/i), rate: findCol(t,/^rate$|patient (service )?rate|daily rate/i),
    total: findCol(t,/total amount|^total$|total billed|patient invoice/i),
    status: findCol(t,/^status$/i), phone: t.columns.filter(c=>/phone|contact number|mobile|whatsapp/i.test(c))
  };
}
function colType(t,col){
  if(/date/i.test(col)) return 'date';
  if(/phone|contact number|mobile|whatsapp/i.test(col)) return 'phone';
  if(/link|url|document|drive|attachment/i.test(col)) return 'url';
  if(/^days$|rate|amount|cost|total|stock|price|qty|quantity/i.test(col)) return 'number';
  const vals=t.rows.map(r=>r.cells[col]).filter(v=>v!==null&&v!==undefined&&v!=='');
  if(vals.length && vals.every(v=>typeof v==='number')) return 'number';
  if(/remark|note|address|comment/i.test(col)) return 'long';
  return 'text';
}
const MONEY_RX=/rate|amount|cost|total|price|payout|margin|billed|deposit/i;
function fmtVal(t,col,v){
  if(v===null||v===undefined||v==='') return '';
  const ty=colType(t,col);
  if(ty==='date') return fmtDate(v);
  if(ty==='number' && typeof v==='number') return MONEY_RX.test(col)? '₹'+v.toLocaleString('en-IN') : v.toLocaleString('en-IN');
  return String(v);
}
function rawStr(v){ return v===null||v===undefined?'':String(v); }

/* recalculation: Days and Total Amount */
function recalc(t,row){
  const R=roles(t), c=row.cells;
  if(R.start && R.end && R.days && isISO(c[R.start]) && isISO(c[R.end])){
    c[R.days] = dayNum(c[R.end]) - dayNum(c[R.start]) + (S.settings.daysInclusive?1:0);
  }
  if(R.days && R.rate && R.total){
    const d=num(c[R.days]), r=num(c[R.rate]);
    if(d!==null && r!==null) c[R.total]=d*r;
  }
}

/* ---------------- filtering / sorting ---------------- */
function rowMatches(t,row){
  for(const [col,ex] of Object.entries(t.filters||{})){
    if(!ex||!ex.length) continue;
    const v=rawStr(row.cells[col]) || '(Blanks)';
    if(ex.includes(v)) return false;
  }
  if(t.colorFilter){
    const cf=t.colorFilter.toUpperCase();
    if(cf==='NONE'){ if(row.rowColor || Object.keys(row.cellColors||{}).length) return false; }
    else if(!((row.rowColor||'').toUpperCase()===cf || Object.values(row.cellColors||{}).some(c=>c.toUpperCase()===cf))) return false;
  }
  const q=(t.search||'').trim().toLowerCase();
  if(q){ const hay=t.columns.map(c=>rawStr(row.cells[c])).join(' \u0001 ').toLowerCase()+' '+fmtVals(t,row); if(!q.split(/\s+/).every(w=>hay.includes(w))) return false; }
  return true;
}
function fmtVals(t,row){ return t.columns.map(c=>fmtVal(t,c,row.cells[c])).join(' ').toLowerCase(); }
function sortRows(t,rows){
  const R=roles(t); const [mode,colRaw,dir] = (t.sort||'priority').split('|');
  const sgn = dir==='desc'?-1:1;
  const cmpCol=(col)=> (a,b)=>{
    const va=a.cells[col], vb=b.cells[col];
    const ea=va===null||va===undefined||va==='', eb=vb===null||vb===undefined||vb==='';
    if(ea&&eb) return 0; if(ea) return 1; if(eb) return -1;
    if(typeof va==='number'&&typeof vb==='number') return (va-vb)*sgn;
    return collator.compare(String(va),String(vb))*sgn;
  };
  let base;
  if(mode==='col') base=cmpCol(colRaw);
  else if(mode==='modified') base=(a,b)=>(b.modified-a.modified);
  else base=(a,b)=>{ // priority: coloured first, then original order
    const ca=a.rowColor||Object.keys(a.cellColors||{}).length?0:1, cb=b.rowColor||Object.keys(b.cellColors||{}).length?0:1;
    return ca-cb;
  };
  const idx=new Map(t.rows.map((r,i)=>[r.id,i]));
  return rows.slice().sort((a,b)=> (b.pinned-a.pinned) || base(a,b) || (idx.get(a.id)-idx.get(b.id)) );
}
function visibleRows(t){ return sortRows(t, t.rows.filter(r=>rowMatches(t,r))); }

function hasFilters(t){ return !!(t.colorFilter || (t.search||'').trim() || Object.values(t.filters||{}).some(a=>a&&a.length)); }
function colorsInUse(t){
  const m=new Map();
  for(const r of t.rows){ const s=new Set(); if(r.rowColor) s.add(r.rowColor.toUpperCase()); Object.values(r.cellColors||{}).forEach(c=>s.add(c.toUpperCase())); s.forEach(c=>m.set(c,(m.get(c)||0)+1)); }
  return [...m.entries()].sort((a,b)=>b[1]-a[1]);
}

function cardHTML(t,row,R,today){
  const c=row.cells; const order=t.order.filter(x=>t.columns.includes(x)&&!t.hidden.includes(x)&&x!==R.name&&x!==R.status);
  const fields = S.density==='compact' ? order.filter(col=>rawStr(c[col])!=='').slice(0,3) : order;
  const badges=[];
  const st=R.status?rawStr(c[R.status]):'';
  if(st){ const k=/active|ongoing|running/i.test(st)?'st-active':/closed|complete/i.test(st)?'st-closed':/pending|hold/i.test(st)?'st-pending':/demise|death|deceased|expired/i.test(st)?'st-demise':''; badges.push(`<span class="badge ${k}">${esc(st)}</span>`); }
  let pulse='';
  const left0 = R.end && isISO(c[R.end]) ? dayNum(c[R.end])-dayNum(today) : null;
  if(left0!==null && isOpenCase(st,left0)){
    const left=left0;
    if(left<0) badges.push(`<span class="badge over">Overdue ${-left}d</span>`);
    else if(left<=S.settings.countdownDays) badges.push(`<span class="badge due">${left===0?'Ends today':left+(left===1?' day':' days')+' remaining'}</span>`);
    if(R.start && isISO(c[R.start]) && dayNum(c[R.start])<=dayNum(today) && left>=0) pulse='<span class="pulse" title="On duty today"></span>';
  }
  const rc=row.rowColor;
  const style = rc ? `--rc:${rc};--rs:${darker(rc)}` : '';
  return `<div class="card ${V.sel.has(row.id)?'sel':''} ${V.focus===row.id?'focus':''}" data-id="${row.id}" style="${style}" tabindex="-1">
    <div class="c-head">
      <button class="star ${row.pinned?'on':''}" data-act="pin" title="${row.pinned?'Unpin':'Pin to top'}">${row.pinned?'★':'☆'}</button>
      ${pulse}<div class="c-title" title="${esc(rawStr(c[R.name]))}">${esc(rawStr(c[R.name]))||'<span style="color:var(--muted)">(no name)</span>'}</div>
      <div class="c-acts">
        ${R.phone.length?`<button class="icon-btn" data-act="wa" title="Send WhatsApp">${ICON.wa}</button>`:''}
        <button class="icon-btn" data-act="color" title="Highlight card">${ICON.palette}</button>
      </div>
    </div>
    ${badges.length?`<div class="c-badges">${badges.join('')}</div>`:''}
    <dl class="c-fields">${fields.map(col=>{
      const v=c[col], cc=row.cellColors[col]; const ty=colType(t,col);
      let shown = ty==='url' && rawStr(v) ? `<span class="link" data-act="doc" data-col="${esc(col)}">${ICON.doc} Open document</span>` : esc(fmtVal(t,col,v));
      return `<div class="f" data-col="${esc(col)}"><dt>${esc(col)}</dt><dd class="${cc?'hl':''}" style="${cc?`background:${cc}`:''}" title="${esc(fmtVal(t,col,v))}">${shown||'<span style="color:#C4BFB2">—</span>'}</dd></div>`;
    }).join('')}</dl>
  </div>`;
}

let sweep=null;
document.addEventListener('mousedown',e=>{
  const board=e.target.closest('#board'); if(!board||e.button!==0) return;
  if(e.target.closest('.card')||e.target.closest('button')||e.target.closest('.empty')) return;
  const br=board.getBoundingClientRect();
  sweep={board, x0:e.clientX-br.left+board.scrollLeft, y0:e.clientY-br.top+board.scrollTop, moved:false, add:e.ctrlKey||e.metaKey, base:new Set(V.sel), el:null};
  e.preventDefault();
});
document.addEventListener('mousemove',e=>{
  if(!sweep) return; const b=sweep.board, br=b.getBoundingClientRect();
  const x=e.clientX-br.left+b.scrollLeft, y=e.clientY-br.top+b.scrollTop;
  if(!sweep.moved && Math.hypot(x-sweep.x0,y-sweep.y0)<5) return;
  if(!sweep.el){ sweep.el=document.createElement('div'); sweep.el.className='sweep'; b.appendChild(sweep.el); }
  sweep.moved=true;
  const L=Math.min(x,sweep.x0),T=Math.min(y,sweep.y0),W=Math.abs(x-sweep.x0),H=Math.abs(y-sweep.y0);
  Object.assign(sweep.el.style,{left:L+'px',top:T+'px',width:W+'px',height:H+'px'});
  const sx1=br.left+L-b.scrollLeft, sy1=br.top+T-b.scrollTop, sx2=sx1+W, sy2=sy1+H;
  const s=sweep.add?new Set(sweep.base):new Set();
  $$('#grid .card').forEach(c=>{ const r=c.getBoundingClientRect(); if(r.right>=sx1&&r.left<=sx2&&r.bottom>=sy1&&r.top<=sy2) s.add(c.dataset.id); });
  V.sel=s; refreshCards();
  // auto-scroll near edges
  if(e.clientY>br.bottom-30) b.scrollTop+=14; else if(e.clientY<br.top+30) b.scrollTop-=14;
});
document.addEventListener('mouseup',()=>{
  if(!sweep) return;
  if(!sweep.moved){ clearSel(); refreshCards(); }
  else { const last=[...V.sel].pop(); if(last){ V.anchor=V.view.find(id=>V.sel.has(id)); V.focus=last; } refreshCards(); }
  if(sweep.el) sweep.el.remove(); sweep=null;
});
function clearSel(){ V.sel.clear(); V.anchor=null; }

/* keyboard */
document.addEventListener('keydown',e=>{
  if(e.ctrlKey && e.shiftKey && (e.key==='T'||e.key==='t')){ e.preventDefault(); insertStamp(); return; }
  const typing = e.target.closest('input,textarea,select,[contenteditable]');
  if(e.key==='Escape'){
    if(document.body.classList.contains('present')){ document.body.classList.remove('present'); try{ document.fullscreenElement && document.exitFullscreen(); }catch(_){} return; }
    if(!$('#pop').classList.contains('hidden')){ closePop(); return; }
    if(typing){ e.target.blur(); return; }
    if(V.sel.size){ clearSel(); refreshCards(); return; }
    if(V.drawer) closeDrawer();
    return;
  }
  if(typing || S.active.startsWith('__')) return;
  if((e.ctrlKey||e.metaKey) && (e.key==='a'||e.key==='A')){ e.preventDefault(); V.sel=new Set(V.view); refreshCards(); return; }
  const arrows={ArrowLeft:1,ArrowRight:1,ArrowUp:1,ArrowDown:1};
  if(arrows[e.key] && V.view.length){
    e.preventDefault();
    const cards=$$('#grid .card'); if(!cards.length) return;
    let i=V.focus?V.view.indexOf(V.focus):-1;
    if(i<0){ i=0; } else {
      const top0=cards[0].offsetTop; let cols=cards.findIndex(c=>c.offsetTop!==top0); if(cols<0) cols=cards.length;
      if(e.key==='ArrowLeft') i=Math.max(0,i-1);
      if(e.key==='ArrowRight') i=Math.min(cards.length-1,i+1);
      if(e.key==='ArrowUp') i=Math.max(0,i-cols);
      if(e.key==='ArrowDown') i=Math.min(cards.length-1,i+cols);
    }
    const id=V.view[i]; V.focus=id;
    if(e.shiftKey){ if(!V.anchor) V.anchor=id; const a=V.view.indexOf(V.anchor); V.sel=new Set(V.view.slice(Math.min(a,i),Math.max(a,i)+1)); }
    else { V.sel=new Set([id]); V.anchor=id; }
    refreshCards();
    const el=$(`#grid .card[data-id="${id}"]`); el && el.scrollIntoView({block:'nearest',inline:'nearest'});
    return;
  }
  if(e.key==='Enter' && V.focus){ e.preventDefault(); openRecord(V.focus,false); }
});
function insertStamp(){
  const s=`[${nowStamp()}] `; const a=document.activeElement;
  if(a && (a.tagName==='TEXTAREA' || (a.tagName==='INPUT' && /text|search/.test(a.type)))){
    const p=a.selectionStart??a.value.length; a.value=a.value.slice(0,p)+s+a.value.slice(a.selectionEnd??p); a.selectionStart=a.selectionEnd=p+s.length; a.dispatchEvent(new Event('input',{bubbles:true}));
  } else { try{ navigator.clipboard.writeText(s.trim()); toast(`Copied ${s.trim()}`);}catch(_){ toast(s.trim()); } }
}
$('#clock').addEventListener('mousedown',e=>e.preventDefault());
$('#clock').addEventListener('click',insertStamp);

/* ---------------- dock & math ---------------- */
function renderDock(){
  const d=$('#dock'); const t=tab();
  if(!t || V.sel.size<2 || S.active.startsWith('__')){ d.classList.add('hidden'); return; }
  const R=roles(t);
  const stVals=R.status?[...new Set(t.rows.map(r=>rawStr(r.cells[R.status])).filter(Boolean))].sort():[];
  d.classList.remove('hidden');
  d.innerHTML=`<b style="padding:0 6px">${V.sel.size} selected</b>
    ${PRESETS.map(([n,c])=>`<span class="sw" data-bcolor="${c}" title="${n}" style="background:${c}"></span>`).join('')}
    <span class="sw clear" data-bcolor="" title="Clear highlight"></span>
    ${R.status?`<select id="bStatus"><option value="">Set ${esc(R.status)}…</option>${stVals.map(v=>`<option>${esc(v)}</option>`).join('')}<option value="__new">New value…</option></select>`:''}
    <button class="btn sm" data-batch="pin">★ Pin</button>
    <button class="btn sm" data-batch="export">Export selected</button>
    <button class="btn sm danger" data-batch="delete">Delete</button>
    <button class="btn sm" data-batch="none">✕</button>`;
}
$('#dock').addEventListener('click',e=>{
  const t=tab(); const ids=[...V.sel];
  const sw=e.target.closest('[data-bcolor]');
  if(sw){ ids.forEach(id=>{ const r=rowById(t,id); r.rowColor=sw.dataset.bcolor||null; r.modified=Date.now(); }); save(); renderBoard(); return; }
  const b=e.target.closest('[data-batch]'); if(!b) return;
  const k=b.dataset.batch;
  if(k==='pin'){ const all=ids.every(id=>rowById(t,id).pinned); ids.forEach(id=>rowById(t,id).pinned=!all); save(); renderBoard(); }
  if(k==='export') exportXlsx(new Set(ids));
  if(k==='none'){ clearSel(); refreshCards(); }
  if(k==='delete'){
    if(!b.classList.contains('armed')){ b.classList.add('armed'); b.textContent=`Delete ${ids.length}?`; setTimeout(()=>{ if(b.isConnected){ b.classList.remove('armed'); b.textContent='Delete'; } },3000); return; }
    t.rows=t.rows.filter(r=>!V.sel.has(r.id)); clearSel(); closeDrawer(); save(); renderTabs(); renderBoard(); toast(`${ids.length} cards deleted`);
  }
});
$('#dock').addEventListener('change',e=>{
  if(e.target.id!=='bStatus') return; const t=tab(), R=roles(t); let v=e.target.value; if(!v) return;
  if(v==='__new'){ v=prompt('New status value'); if(!v) return renderDock(); }
  [...V.sel].forEach(id=>{ const r=rowById(t,id); r.cells[R.status]=v; r.modified=Date.now(); r.log.push(`${R.status} → ${v} at ${nowStamp()}`); });
  save(); renderBoard(); toast(`${V.sel.size} cards set to “${v}”`);
});
function renderMath(){
  const m=$('#mathStrip'); if(!m) return; const t=tab();
  const ids = V.sel.size? [...V.sel] : V.view;
  const label = V.sel.size? `<b>${V.sel.size}</b> selected` : `<b>${V.view.length}</b> shown`;
  const numCols=t.columns.filter(c=>colType(t,c)==='number');
  const parts=numCols.map(c=>{ const vals=ids.map(id=>num(rowById(t,id)?.cells[c])).filter(v=>v!==null); if(!vals.length) return '';
    const s=vals.reduce((a,b)=>a+b,0); const f=v=>MONEY_RX.test(c)?'₹'+Math.round(v).toLocaleString('en-IN'):(+v.toFixed(1)).toLocaleString('en-IN');
    return `<span class="m">${esc(c)}: SUM <b>${f(s)}</b> · AVG <b>${f(s/vals.length)}</b> · MIN <b>${f(Math.min(...vals))}</b> · MAX <b>${f(Math.max(...vals))}</b> · COUNT <b>${vals.length}</b></span>`; }).filter(Boolean);
  m.innerHTML=`<span>${label}</span>${parts.join('')}`;
}

/* ---------------- popovers ---------------- */
function openPop(anchor, html, onMount){
  const p=$('#pop'); p.innerHTML=html; p.classList.remove('hidden');
  const r=anchor.getBoundingClientRect(); const pw=p.offsetWidth, ph=p.offsetHeight;
  let left=Math.min(r.left, innerWidth-pw-10), top=r.bottom+6; if(top+ph>innerHeight-10) top=Math.max(10,r.top-ph-6);
  p.style.left=Math.max(10,left)+'px'; p.style.top=top+'px';
  V.popFor=anchor; onMount&&onMount(p);
}
function closePop(){ $('#pop').classList.add('hidden'); V.popFor=null; }
document.addEventListener('mousedown',e=>{ if(!$('#pop').classList.contains('hidden') && !e.target.closest('#pop') && e.target!==V.popFor && !(V.popFor&&V.popFor.contains(e.target))) closePop(); },true);

/* palette (row or cell) */
function openPalette(anchor, target){ // target: {rows:[ids]} or {row:id, col}
  const t=tab();
  const cur = target.col ? rowById(t,target.row).cellColors[target.col] : (target.rows.length===1? rowById(t,target.rows[0]).rowColor : null);
  openPop(anchor, `<h4>${target.col?`Highlight “${esc(target.col)}”`:'Highlight card'}</h4>
    <div class="pal">${PRESETS.map(([n,c])=>`<button data-pc="${c}" ${cur&&cur.toUpperCase()===c?'style="border-color:var(--focus);border-width:2px"':''}><span class="sw" style="background:${c}"></span>${n.replace('Soft ','').replace('Neutral ','')}</button>`).join('')}
      <button data-pc=""><span class="sw clear"></span>Clear</button></div>
    <div class="row" style="margin-top:10px"><input type="color" id="pcCustom" value="${cur||'#FDE68A'}" style="width:38px;height:30px;border:none;padding:0;background:none">
      <input id="pcHex" value="${cur||''}" placeholder="#HEX" style="flex:1;border:1px solid var(--line2);border-radius:6px;padding:5px 7px">
      <button class="btn sm" id="pcApply">Apply</button></div>`,
  p=>{
    const apply=c=>{ c=c?c.toUpperCase():null;
      if(target.col){ const r=rowById(t,target.row); if(c) r.cellColors[target.col]=c; else delete r.cellColors[target.col]; r.modified=Date.now(); }
      else target.rows.forEach(id=>{ const r=rowById(t,id); r.rowColor=c; r.modified=Date.now(); });
      save(); closePop(); renderBoard(); if(V.drawer&&V.drawer.type==='record') openRecord(V.drawer.id, V.drawer.edit);
    };
    p.addEventListener('click',e=>{ const b=e.target.closest('[data-pc]'); if(b) apply(b.dataset.pc); });
    $('#pcCustom',p).addEventListener('input',e=>$('#pcHex',p).value=e.target.value.toUpperCase());
    $('#pcApply',p).addEventListener('click',()=>{ let v=$('#pcHex',p).value.trim(); if(/^[0-9a-f]{6}$/i.test(v)) v='#'+v; if(/^#[0-9a-f]{6}$/i.test(v)) apply(v); else toast('Use a 6-digit HEX like #FDE68A'); });
  });
}

/* column filter dropdown */
function openColFilter(anchor,col){
  const t=tab(); const counts=new Map();
  t.rows.forEach(r=>{ const v=rawStr(r.cells[col])||'(Blanks)'; counts.set(v,(counts.get(v)||0)+1); });
  const ty=colType(t,col);
  const vals=[...counts.keys()].sort((a,b)=> a==='(Blanks)'?1:b==='(Blanks)'?-1:collator.compare(a,b));
  const ex=new Set(t.filters[col]||[]);
  const lab=ty==='date'?['Oldest → Newest','Newest → Oldest']:ty==='number'?['Low → High','High → Low']:['Sort A → Z','Sort Z → A'];
  openPop(anchor, `<h4>${esc(col)}</h4>
    <div class="row" style="margin-bottom:8px"><button class="btn sm" data-s="asc">${lab[0]}</button><button class="btn sm" data-s="desc">${lab[1]}</button></div>
    <input id="cfSearch" placeholder="Search values…" style="width:100%;border:1px solid var(--line2);border-radius:6px;padding:5px 7px;margin-bottom:6px">
    <div class="row" style="margin-bottom:4px;font-size:12px"><a href="#" data-all="1">Select all</a> · <a href="#" data-all="0">Clear all</a></div>
    <div id="cfList">${vals.map(v=>`<label class="chk" data-v="${esc(v.toLowerCase())}"><input type="checkbox" value="${esc(v)}" ${ex.has(v)?'':'checked'}> <span>${esc(ty==='date'?fmtDate(v):v)}</span><span class="n">${counts.get(v)}</span></label>`).join('')}</div>`,
  p=>{
    const sync=()=>{ t.filters[col]=$$('#cfList input',p).filter(i=>!i.checked).map(i=>i.value); if(!t.filters[col].length) delete t.filters[col]; save(); renderBoard();
      $(`#colstrip [data-col="${CSS.escape(col)}"]`)?.classList.toggle('on',!!t.filters[col]); $('#clearF').disabled=!hasFilters(t); };
    p.addEventListener('change',sync);
    p.addEventListener('click',e=>{ const a=e.target.closest('[data-all]'); if(a){ e.preventDefault(); $$('#cfList label:not(.hidden) input',p).forEach(i=>i.checked=a.dataset.all==='1'); sync(); }
      const s=e.target.closest('[data-s]'); if(s){ t.sort=`col|${col}|${s.dataset.s}`; save(); closePop(); renderBoardShell(); renderBoard(); } });
    $('#cfSearch',p).addEventListener('input',e=>{ const q=e.target.value.toLowerCase(); $$('#cfList label',p).forEach(l=>l.classList.toggle('hidden',!l.dataset.v.includes(q))); });
    $('#cfSearch',p).focus();
  });
}

/* card layout menu */
function openLayout(anchor){
  const t=tab(); const R=roles(t);
  const items=()=>t.order.filter(c=>t.columns.includes(c)).map(c=>`<div class="lay-item" draggable="true" data-c="${esc(c)}">
    <span class="grip" title="Drag to reorder">⠿</span>
    <label><input type="checkbox" ${t.hidden.includes(c)?'':'checked'} ${c===R.name?'disabled title="Card title"':''}> ${esc(c)}${c===R.name?' <small style="color:var(--muted)">(title)</small>':''}${c===R.status?' <small style="color:var(--muted)">(badge)</small>':''}</label>
    <button class="icon-btn" data-mv="-1" title="Move up">↑</button><button class="icon-btn" data-mv="1" title="Move down">↓</button></div>`).join('');
  openPop(anchor, `<h4>Card layout · ${esc(t.name)}</h4><div style="font-size:12px;color:var(--muted);margin-bottom:6px">Tick to show on the card face. Drag or use arrows to reorder. Compact view shows the first 3 filled fields.</div>
    <div id="layList">${items()}</div>
    <div class="row" style="margin-top:10px"><input id="newCol" placeholder="New tag / column name" style="flex:1;border:1px solid var(--line2);border-radius:6px;padding:5px 7px"><button class="btn sm" id="addCol">+ Add Tag</button></div>`,
  p=>{
    const rer=()=>{ $('#layList',p).innerHTML=items(); save(); renderBoard(); };
    p.addEventListener('change',e=>{ const it=e.target.closest('.lay-item'); if(!it) return; const c=it.dataset.c; t.hidden=e.target.checked? t.hidden.filter(x=>x!==c) : [...t.hidden,c]; save(); renderBoard(); });
    p.addEventListener('click',e=>{ const mv=e.target.closest('[data-mv]'); if(mv){ const c=mv.closest('.lay-item').dataset.c; const i=t.order.indexOf(c), j=i+ +mv.dataset.mv; if(j<0||j>=t.order.length) return; [t.order[i],t.order[j]]=[t.order[j],t.order[i]]; rer(); }
      if(e.target.id==='addCol'){ const n=$('#newCol',p).value.trim(); if(addColumn(t,n)){ $('#newCol',p).value=''; rer(); renderBoardShell(); renderBoard(); openLayout($('#layoutBtn')); } } });
    let drag=null;
    p.addEventListener('dragstart',e=>{ drag=e.target.closest('.lay-item')?.dataset.c; });
    p.addEventListener('dragover',e=>{ const it=e.target.closest('.lay-item'); if(!it) return; e.preventDefault(); $$('.lay-item',p).forEach(x=>x.classList.toggle('drag-over',x===it)); });
    p.addEventListener('drop',e=>{ const it=e.target.closest('.lay-item'); if(!it||!drag) return; e.preventDefault(); const to=it.dataset.c; t.order=t.order.filter(x=>x!==drag); t.order.splice(t.order.indexOf(to),0,drag); drag=null; rer(); });
  });
}
function addColumn(t,name){
  if(!name) return false; if(t.columns.some(c=>c.toLowerCase()===name.toLowerCase())){ toast('That tag already exists'); return false; }
  t.columns.push(name); t.order.push(name); save(); toast(`Added “${name}” to every card in ${t.name}`); return true;
}

/* ---------------- drawer ---------------- */
function openDrawer(){ // fresh element each time so old listeners never pile up
  const old=$('#drawer'); const n=old.cloneNode(false); old.replaceWith(n); n.classList.remove('hidden');
  n.addEventListener('click',e=>{ if(e.target.closest('[data-dclose]')) closeDrawer(); }); return n; }
function closeDrawer(){ V.drawer=null; const d=$('#drawer'); d.classList.add('hidden'); d.innerHTML=''; }

function openRecord(id, edit=false, focusCol=null){
  const t=tab(); const row=rowById(t,id); if(!row) return; const R=roles(t);
  V.drawer={type:'record',id,edit};
  const d=openDrawer();
  const uniques={}; t.columns.forEach(c=>{ if(['text','long'].includes(colType(t,c))) uniques[c]=[...new Set(t.rows.map(r=>rawStr(r.cells[c]).trim()).filter(Boolean))].sort(collator.compare).slice(0,400); });
  const fieldRow=c=>{
    const v=row.cells[c], ty=colType(t,c), cc=row.cellColors[c]; let val;
    if(edit){
      if(ty==='date') val=`<input type="date" data-e="${esc(c)}" value="${isISO(v)?v:''}">`;
      else if(ty==='number') val=`<input type="number" step="any" data-e="${esc(c)}" value="${rawStr(v)}">`;
      else if(ty==='long') val=`<textarea data-e="${esc(c)}">${esc(rawStr(v))}</textarea>`;
      else val=`<input type="text" data-e="${esc(c)}" value="${esc(rawStr(v))}" ${uniques[c]?`list="dl-${btoa(unescape(encodeURIComponent(c))).replace(/=/g,'')}"`:''} autocomplete="off">`;
    } else {
      val = ty==='url'&&rawStr(v) ? `<span class="link" data-docopen="${esc(c)}">${ICON.doc} ${esc(String(v).slice(0,60))}</span>` : esc(fmtVal(t,c,v)) || '<span style="color:#C4BFB2">—</span>';
    }
    const calc = (c===R.days||c===R.total)&&edit ? ' <small style="color:var(--muted)">(auto)</small>':'';
    return `<div class="k">${esc(c)}${calc}</div><div class="v ${cc&&!edit?'hl':''}" style="${cc?`background:${cc}`:''}">${val}</div><div class="c"><button class="icon-btn" data-ccolor="${esc(c)}" title="Highlight this field">${ICON.palette}</button></div>`;
  };
  const left = R.end&&isISO(row.cells[R.end]) ? dayNum(row.cells[R.end])-dayNum(isoToday()) : null;
  d.innerHTML=`<div class="d-head"><h3>${esc(rawStr(row.cells[R.name])||'(no name)')}</h3>
      ${edit?'<span class="ro-flag" style="background:var(--focus-soft);color:#1E3A8A">Editing</span>':'<span class="ro-flag">🔒 Read-only</span>'}
      <button class="icon-btn" data-dclose title="Close (Esc)">${ICON.close}</button></div>
    <div class="d-body">
      ${row.rowColor?`<div class="infobox" style="background:${row.rowColor}">Card highlight: <b>${esc(colorName(row.rowColor))}</b></div>`:''}
      <div class="rec">${t.columns.map(fieldRow).join('')}</div>
      ${edit?`<div class="row" style="margin-top:10px"><input id="addTagName" placeholder="New tag name (adds a column to every card)" style="flex:1;border:1px solid var(--line2);border-radius:6px;padding:6px 8px"><button class="btn sm" id="addTagBtn">+ Add Tag</button></div>`:''}
      ${Object.entries(uniques).map(([c,vals])=>`<datalist id="dl-${btoa(unescape(encodeURIComponent(c))).replace(/=/g,'')}">${vals.map(v=>`<option value="${esc(v)}">`).join('')}</datalist>`).join('')}
      ${R.end && !edit ? `<div class="section-h">Renewal</div><div class="row">${left!==null?`<span class="badge ${left<0?'over':left<=S.settings.countdownDays?'due':''}">${left<0?`Overdue by ${-left} days`:`${left} days remaining`}</span>`:''}
        <span>Extend end date by</span><input id="renewN" type="number" min="1" value="${S.settings.renewDays}" style="width:64px;border:1px solid var(--line2);border-radius:6px;padding:4px 6px"> days <button class="btn sm" id="renewBtn" ${isISO(row.cells[R.end])?'':'disabled'}>Renew</button></div>`:''}
      <div class="section-h">Activity log</div>
      <div class="log">${(row.log||[]).slice().reverse().map(l=>`<div>${esc(l)}</div>`).join('')||'<div style="color:var(--muted)">No activity yet</div>'}</div>
    </div>
    <div class="d-foot">
      ${edit?`<button class="btn primary" id="saveRec">Save</button><button class="btn" id="cancelRec">Cancel</button>`
            :`<button class="btn primary" id="editRec">Edit card</button>${R.phone.length?`<button class="btn" id="waRec">${ICON.wa} Send WhatsApp</button>`:''}<button class="btn" id="colorRec">${ICON.palette} Highlight</button><button class="btn" id="pinRec">${row.pinned?'★ Unpin':'☆ Pin'}</button>`}
      <span class="spacer"></span>${edit?'':'<button class="btn danger" id="delRec">Delete</button>'}
    </div>`;
  if(edit){
    const f = focusCol? $(`[data-e="${CSS.escape(focusCol)}"]`,d) : $('[data-e]',d); f&&f.focus();
    // live recalculation preview
    d.addEventListener('input',ev=>{ const c=ev.target.dataset?.e; if(!c||![R.start,R.end,R.rate].includes(c)) return; const tmp={cells:{...row.cells}}; $$('[data-e]',d).forEach(i=>tmp.cells[i.dataset.e]=readInput(t,i)); recalc(t,tmp);
      if(R.days){ const i=$(`[data-e="${CSS.escape(R.days)}"]`,d); if(i&&tmp.cells[R.days]!=null) i.value=tmp.cells[R.days]; }
      if(R.total){ const i=$(`[data-e="${CSS.escape(R.total)}"]`,d); if(i&&tmp.cells[R.total]!=null) i.value=tmp.cells[R.total]; } });
  }
  bindRecord(d,t,row,R,edit);
  if(!edit){ ppRecordDocs(d,t,row); ppStaffDrawer(d,t,row); }
}
function readInput(t,i){ const c=i.dataset.e, ty=colType(t,c); const v=i.value;

$('#fileIn').addEventListener('change',async e=>{ const f=e.target.files[0]; e.target.value=''; if(f) await importXlsx(f); });
function argbToHex(c){ if(!c) return null; const a=c.argb||null; if(!a||a.length<6) return null; const h=a.slice(-6).toUpperCase(); return '#'+h; }
function cellFill(cell){ const f=cell.fill; if(!f||f.type!=='pattern'||!f.pattern||f.pattern==='none') return null; return argbToHex(f.fgColor)||argbToHex(f.bgColor); }
function cellVal(cell){
  let v=cell.value;
  if(v && typeof v==='object'){
    if(v instanceof Date) return `${v.getUTCFullYear()}-${pad(v.getUTCMonth()+1)}-${pad(v.getUTCDate())}`;
    if('result' in v || 'formula' in v || 'sharedFormula' in v){ v=v.result; if(v instanceof Date) return `${v.getUTCFullYear()}-${pad(v.getUTCMonth()+1)}-${pad(v.getUTCDate())}`; if(v&&typeof v==='object'&&'error' in v) return null; return v??null; }
    if(v.richText) return v.richText.map(r=>r.text).join('');
    if(v.text) return v.hyperlink? v.hyperlink : v.text;
    if(v.hyperlink) return v.hyperlink;
    return null;
  }
  if(typeof v==='string'){ v=v.trim(); return v===''?null:v; }
  return v??null;
}
async function importXlsx(file){
  if(typeof ExcelJS==='undefined'){ toast('Excel engine not loaded'); return; }
  try{
    const wb=new ExcelJS.Workbook(); await wb.xlsx.load(await file.arrayBuffer());
    const report=[];
    wb.eachSheet(ws=>{
      const hdr=ws.getRow(1); const cols=[]; const colIdx=[];
      hdr.eachCell({includeEmpty:false},(c,i)=>{ const n=String(cellVal(c)??'').trim(); if(n){ cols.push(n); colIdx.push(i); } });
      if(!cols.length) return;
      const rows=[]; let recalcN=0;
      for(let r=2;r<=ws.rowCount;r++){
        const xr=ws.getRow(r); const cells={}; const fills={}; let any=false;
        const fcols=new Set();
        colIdx.forEach((ci,k)=>{ const c=xr.getCell(ci); const v=cellVal(c); cells[cols[k]]=v; if(v!==null) any=true; const f=cellFill(c); if(f) fills[cols[k]]=f;
          if(c.formula || (c.value && typeof c.value==='object' && ('formula' in c.value || 'sharedFormula' in c.value))) fcols.add(cols[k]); });
        if(!any) continue;
        const row=mkRow(cells);
        const fv=Object.values(fills);
        if(fv.length===cols.length && fv.every(x=>x===fv[0])) row.rowColor=fv[0];
        else if(fv.length>=Math.ceil(cols.length*0.6)){ // mostly one colour = row colour; outliers become cell flags
          const cnt={}; fv.forEach(x=>cnt[x]=(cnt[x]||0)+1); const top=Object.entries(cnt).sort((a,b)=>b[1]-a[1])[0][0]; row.rowColor=top;
          Object.entries(fills).forEach(([k,x])=>{ if(x!==top) row.cellColors[k]=x; });
        } else row.cellColors=fills;
        if(row.rowColor==='#FFFFFF' && !fv.some(x=>x!=='#FFFFFF')) row.rowColor=null;
        row._f=[...fcols];
        row.log.push(`Imported from ${file.name} at ${nowStamp()}`);
        rows.push(row);
      }
      let t=S.tabs.find(x=>x.name.toLowerCase()===ws.name.toLowerCase());
      if(t){ t.columns=cols; t.order=[...t.order.filter(c=>cols.includes(c)), ...defaultOrder(cols).filter(c=>!t.order.includes(c))]; t.hidden=t.hidden.filter(c=>cols.includes(c)); t.rows=rows; t.filters={}; }
      else { t=mkTab(ws.name,cols,rows); if(/remark|source/i.test(cols.join())) t.hidden=cols.filter(c=>/^source$/i.test(c)); S.tabs.push(t); }
      // fill missing Days from dates (formula cells without cached results)
      const R=roles(t);
      // Days written as a formula in Excel (or missing) are re-derived with the chosen rule. Typed-in Days and all Totals are left as they were.
      rows.forEach(r=>{ const wasF=(r._f||[]).includes(R.days); delete r._f;
        if(R.days && (wasF || r.cells[R.days]===null || r.cells[R.days]===undefined) && isISO(r.cells[R.start]) && isISO(r.cells[R.end])){
          const nd=dayNum(r.cells[R.end])-dayNum(r.cells[R.start])+(S.settings.daysInclusive?1:0); if(nd!==r.cells[R.days]){ r.cells[R.days]=nd; recalcN++; } } });
      report.push(`${ws.name}: ${rows.length} cards${recalcN?`, ${recalcN} Days re-counted`:''}`);
      if(!S.tabs.find(x=>x.id===S.active)||S.active.startsWith('__')) S.active=t.id;
      if(report.length===1) S.active=t.id;
    });
    clearSel(); closeDrawer(); save(); renderAll(); toast('Imported · '+report.join(' · '));
  }catch(err){ console.error(err); toast('Could not read that file: '+err.message); }
}
function hexToArgb(h){ return 'FF'+h.replace('#','').toUpperCase(); }
async function exportXlsx(onlyIds){

      const xr=ws.addRow(vals);

  toast(`Exported ${name}`);

/* ---------------- Geocoding (used by Settings test now; map view in Phase 2) ---------------- */
async function geocode(q){
  const key=q.trim().toLowerCase(); if(S.geoCache[key]) return {...S.geoCache[key],cached:true};
  let res=null, err=null;
  if(S.settings.olaKey && S.settings.geocoder!=='osm'){
    try{ const r=await fetch(`https://api.olamaps.io/places/v1/geocode?address=${encodeURIComponent(q)}&language=English&api_key=${encodeURIComponent(S.settings.olaKey)}`,{headers:{'X-Request-Id':uid()}});
      if(!r.ok) throw new Error('Ola Maps HTTP '+r.status); const j=await r.json(); const g=(j.geocodingResults||[])[0];
      if(g) res={lat:g.geometry.location.lat,lng:g.geometry.location.lng,label:g.formatted_address,src:'Ola Maps'}; else throw new Error('Ola Maps: no match');
    }catch(e){ err=e.message; }
  }
  if(!res){
    try{ const r=await fetch(`https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=in&q=${encodeURIComponent(q)}`); const j=await r.json();
      if(j[0]) res={lat:+j[0].lat,lng:+j[0].lon,label:j[0].display_name,src:'OpenStreetMap'+(err?' (fallback)':'')}; }catch(e){ err=(err?err+'; ':'')+'OSM: '+e.message; }
  }
  if(res){ S.geoCache[key]={lat:res.lat,lng:res.lng,label:res.label,src:res.src}; save(); return res; }
  throw new Error(err||'No match found');
}

/* ---------------- Dashboard ---------------- */
function dataTabs(){ return S.tabs; }
function dashSource(){
  S.dash=S.dash||{tabId:null,applyFilters:false};
  let t=S.tabs.find(x=>x.id===S.dash.tabId);
  if(!t) t=S.tabs.find(x=>roles(x).total)||S.tabs.find(x=>x.rows.length)||S.tabs[0];

function monthOf(t,row,R){
  if(R.start && isISO(row.cells[R.start])) return row.cells[R.start].slice(0,7);
  const src=findCol(t,/^source$|^month$/i); const m=src && String(row.cells[src]??'').match(/^(\d{4})-(\d{2})/);
  return m? `${m[1]}-${m[2]}` : null;
}
function monthLabel(ym){ const [y,m]=ym.split('-'); return `${MON[+m-1]} ${y.slice(2)}`; }
function groupBy(rows,keyFn,R){
  const m=new Map();
  rows.forEach(r=>{ const k=keyFn(r); const key=(k===null||k===undefined||k==='')?'(Not recorded)':String(k).trim();
    const g=m.get(key)||{key,cases:0,days:0,billed:0,rateSum:0,rateN:0};
    g.cases++; const d=num(r.cells[R.days]); if(d!==null&&d>0) g.days+=d; const b=num(r.cells[R.total]); if(b!==null) g.billed+=b;
    const ra=num(r.cells[R.rate]); if(ra!==null){ g.rateSum+=ra; g.rateN++; }
    m.set(key,g); });
  return [...m.values()].map(g=>({...g,avgRate:g.rateN?g.rateSum/g.rateN:null}));
}
function topN(arr,n,by){ const s=arr.slice().sort((a,b)=>b[by]-a[by]||b.cases-a.cases); if(s.length<=n) return s;
  const rest=s.slice(n); const o=rest.reduce((a,g)=>({key:`Other (${rest.length})`,cases:a.cases+g.cases,days:a.days+g.days,billed:a.billed+g.billed,rateSum:a.rateSum+g.rateSum,rateN:a.rateN+g.rateN}),{cases:0,days:0,billed:0,rateSum:0,rateN:0});
  o.avgRate=o.rateN?o.rateSum/o.rateN:null; o.other=true; return [...s.slice(0,n),o]; }

function computeDash(t, applyFilters){
  const R=roles(t); const rows = applyFilters? t.rows.filter(r=>rowMatches(t,r)) : t.rows.slice();
  const today=isoToday();
  const C={ service:findCol(t,/^service|service name/i), doctor:findCol(t,/doctor|referr|consultant/i), locality:findCol(t,/locality|area|zone|location/i), caseType:findCol(t,/case type/i), patient:R.name };
  const st=r=>R.status?rawStr(r.cells[R.status]):'';
  const billedVals=rows.map(r=>num(r.cells[R.total])).filter(v=>v!==null);
  const dayVals=rows.map(r=>num(r.cells[R.days])).filter(v=>v!==null&&v>0);
  const totalBilled=billedVals.reduce((a,b)=>a+b,0);
  const running=[], overdue=[], endingSoon=[];
  rows.forEach(r=>{ if(!(R.end&&isISO(r.cells[R.end]))) return; const left=dayNum(r.cells[R.end])-dayNum(today); if(!isOpenCase(st(r),left)) return;
    if(left<0) overdue.push({r,left}); else { running.push(r); if(left<=7) endingSoon.push({r,left}); } });
  const ct=C.caseType? rows.map(r=>rawStr(r.cells[C.caseType]).toLowerCase()) : [];
  const nRen=ct.filter(x=>/renew/.test(x)).length, nNew=ct.filter(x=>/\bnew\b/.test(x)&&!/renew/.test(x)).length;
  const demise=rows.filter(r=>/demise|death|deceased|expired/i.test(st(r))).length;
  // billing check
  const mism=[]; let checked=0;
  if(R.days&&R.rate&&R.total) rows.forEach(r=>{ const d=num(r.cells[R.days]),ra=num(r.cells[R.rate]),T=num(r.cells[R.total]); if(d===null||ra===null||T===null) return; checked++; const exp=d*ra; if(Math.abs(exp-T)>0.5) mism.push({r,exp,T,diff:T-exp}); });
  mism.sort((a,b)=>Math.abs(b.diff)-Math.abs(a.diff));
  // months
  const months=new Map(); rows.forEach(r=>{ const m=monthOf(t,r,R); if(!m) return; const g=months.get(m)||{key:m,cases:0,billed:0,days:0}; g.cases++; const b=num(r.cells[R.total]); if(b!==null) g.billed+=b; const dd=num(r.cells[R.days]); if(dd!==null&&dd>0) g.days+=dd; months.set(m,g); });
  const monthArr=[...months.values()].sort((a,b)=>a.key.localeCompare(b.key));
  const noMonth=rows.length-monthArr.reduce((a,g)=>a+g.cases,0);
  const completeness=t.columns.map(c=>({key:c,filled:rows.filter(r=>rawStr(r.cells[c]).trim()!=='').length})).map(x=>({...x,pct:rows.length?x.filled/rows.length:0}));
  return {
    t,R,C,rows,applyFilters,
    kpi:{ cases:rows.length, patients:new Set(rows.map(r=>rawStr(r.cells[R.name]).trim().toLowerCase().replace(/^(mr|mrs|ms|dr)\.?\s+/,'')).filter(Boolean)).size,
      billed:totalBilled, avgBill:billedVals.length?totalBilled/billedVals.length:null, days:dayVals.reduce((a,b)=>a+b,0), avgDays:dayVals.length?dayVals.reduce((a,b)=>a+b,0)/dayVals.length:null,
      medDays: dayVals.length? dayVals.slice().sort((a,b)=>a-b)[Math.floor(dayVals.length/2)] : null,
      running:running.length, overdue:overdue.length, renewShare:(nNew+nRen)?nRen/(nNew+nRen):null, nNew, nRen, typed:nNew+nRen, demise },
    months:monthArr, noMonth,
    services: C.service? groupBy(rows,r=>r.cells[C.service],R):[],
    doctors: C.doctor? groupBy(rows,r=>r.cells[C.doctor],R):[],
    localities: C.locality? groupBy(rows,r=>r.cells[C.locality],R):[],
    statuses: R.status? groupBy(rows,r=>r.cells[R.status],R):[],
    mism, checked, overdue:overdue.sort((a,b)=>a.left-b.left), endingSoon:endingSoon.sort((a,b)=>a.left-b.left), completeness
  };
}
const inr=v=>v===null||v===undefined?'—':'₹'+Math.round(v).toLocaleString('en-IN');
const inrShort=v=>{ if(v===null) return '—'; const a=Math.abs(v); return a>=1e7?'₹'+(v/1e7).toFixed(2)+' Cr':a>=1e5?'₹'+(v/1e5).toFixed(2)+' L':inr(v); };
const pct=v=>v===null?'—':Math.round(v*100)+'%';

function barsHTML(items,valKey,fmt,extra){
  const max=Math.max(1,...items.map(i=>i[valKey]));
  return `<div class="bars">${items.map(i=>`<div class="bar-row" title="${esc(i.key)}: ${esc(fmt(i[valKey]))}${extra?' · '+esc(extra(i)):''}">
    <span class="bl ${i.key==='(Not recorded)'||i.other?'muted':''}">${esc(i.key)}</span>
    <span class="bt"><span class="bf ${i.other||i.key==='(Not recorded)'?'dim':''}" style="width:${(i[valKey]/max*100).toFixed(1)}%"></span></span>
    <span class="bv">${esc(fmt(i[valKey]))}</span></div>`).join('')}</div>`;
}
function colsHTML(items,valKey,fmt){
  const max=Math.max(1,...items.map(i=>i[valKey]));
  return `<div class="cols">${items.map(i=>`<div class="col" title="${esc(monthLabel(i.key))}: ${esc(fmt(i[valKey]))}">
    <span class="cv">${esc(fmt(i[valKey]))}</span><span class="cbar"><span class="cf" style="height:${Math.max(2,i[valKey]/max*100).toFixed(1)}%"></span></span><span class="cl">${esc(monthLabel(i.key))}</span></div>`).join('')}</div>`;
}
function tableHTML(head,rows){ return `<div class="tblwrap"><table class="dt"><thead><tr>${head.map(h=>`<th>${esc(h)}</th>`).join('')}</tr></thead><tbody>${rows.join('')}</tbody></table></div>`; }

/* Executive summary: headline figures + plain-language takeaways */
function headline(D){
  const K=D.kpi, R=D.R, t=D.t;
  const cur=isoToday().slice(0,7);
  const full=D.months.filter(m=>m.key<cur), last=full[full.length-1], prev=full[full.length-2];
  const partial=D.months.find(m=>m.key===cur);
  const first=D.months[0], lastAny=D.months[D.months.length-1];
  const period = first ? (first.key===lastAny.key? monthLabel(first.key) : `${MON[+first.key.slice(5)-1]} ${first.key.slice(0,4)===lastAny.key.slice(0,4)?'':first.key.slice(0,4)+' '}– ${MON[+lastAny.key.slice(5)-1]} ${lastAny.key.slice(0,4)}`) : 'All records';
  const delta=(a,b,f)=>{ if(!a||!b||!b[f]) return ''; const d=(a[f]-b[f])/b[f]; const up=d>=0; return `<span class="${up?'up':'down'}">${up?'▲':'▼'} ${Math.abs(Math.round(d*100))}%</span> vs ${MON[+b.key.slice(5)-1]}`; };
  const mname=m=>MON[+m.key.slice(5)-1];
  const kpis=[];
  if(R.total) kpis.push({label:'Revenue billed',value:inrShort(K.billed),sub: last? `${mname(last)}: ${inrShort(last.billed)} ${delta(last,prev,'billed')}` : `avg ${inr(K.avgBill)} per case`});
  kpis.push({label:'Cases handled',value:K.cases.toLocaleString('en-IN'),sub: last? `${mname(last)}: ${last.cases} ${delta(last,prev,'cases')}` : `${K.patients} patients`});
  if(R.days) kpis.push({label:'Days of care delivered',value:K.days.toLocaleString('en-IN'),sub: last&&last.days? `${mname(last)}: ${last.days.toLocaleString('en-IN')} ${delta(last,prev,'days')}` : `median ${K.medDays??'—'} days per case`});
  if(D.C.caseType && K.typed>=10) kpis.push({label:'Families who renewed',value:pct(K.renewShare),sub:`${K.nRen} renewals of ${K.typed} cases with type recorded`});
  else kpis.push({label:'Families served',value:K.patients.toLocaleString('en-IN'),sub:`${(K.cases/Math.max(1,K.patients)).toFixed(1)} cases per patient`});

  const pts=[], acts=[];
  if(R.total && D.months.length){
    const peak=D.months.filter(m=>m.key<cur).sort((a,b)=>b.billed-a.billed)[0];
    if(last&&prev) pts.push(`<b>${mname(last)}</b> billed <b>${inrShort(last.billed)}</b> from ${last.cases} cases, ${last.billed>=prev.billed?'up':'down'} ${Math.abs(Math.round((last.billed-prev.billed)/prev.billed*100))}% on ${mname(prev)}.${peak&&peak.key!==last.key?` The best month so far was <b>${mname(peak)}</b> at ${inrShort(peak.billed)}.`:''}`);
    if(partial){ const day=+isoToday().slice(8); pts.push(`<b>${mname(partial)}</b> is ${day} day${day>1?'s':''} old and already has ${partial.cases} cases starting this month, worth ${inrShort(partial.billed)}.`); }
  }
  const svc=D.services.filter(x=>x.key!=='(Not recorded)').sort((a,b)=>b.billed-a.billed);
  if(svc.length && K.billed){ const top3=svc.slice(0,3).reduce((a,x)=>a+x.billed,0);
    pts.push(`<b>${esc(svc[0].key)}</b> is the biggest earner: <b>${pct(svc[0].billed/K.billed)}</b> of all billing (${inrShort(svc[0].billed)}) from ${svc[0].cases} cases.${svc.length>3?` The top three services bring in ${pct(top3/K.billed)}.`:''}`); }
  const docs=D.doctors.filter(x=>x.key!=='(Not recorded)').sort((a,b)=>b.billed-a.billed);
  if(docs.length>=3 && K.billed){ const s3=docs.slice(0,3).reduce((a,x)=>a+x.billed,0);
    pts.push(`Referrals came from <b>${docs.length} doctors</b>. The top three (${docs.slice(0,3).map(d=>esc(d.key)).join(', ')}) account for <b>${pct(s3/K.billed)}</b> of billing.`); }
  if(R.days && K.medDays) pts.push(`A typical case runs <b>${K.medDays} days</b>, and the average bill is <b>${inrShort(K.avgBill)}</b>.${D.C.caseType&&K.typed>=10?` ${pct(K.renewShare)} of cases with a recorded type are renewals, a sign families stay with the service.`:''}`);
  if(K.overdue) acts.push(`<b>${K.overdue} cases</b> are past their end date but not closed. Confirm whether care continued, then renew or close them so billing is complete.`);
  if(D.mism.length) acts.push(`<b>${D.mism.length} of ${D.checked} cases</b> have a total that does not follow days × rate. Most look like flat-price packages or rentals. Agree one billing rule with accounts so totals can be checked automatically.`);
  const gaps=[D.C.doctor,D.C.locality,D.C.caseType,R.status].filter(Boolean).map(c=>D.completeness.find(x=>x.key===c)).filter(x=>x&&x.pct<0.7);
  if(gaps.length) acts.push(`Record ${gaps.map(g=>`<b>${esc(g.key)}</b> (${pct(g.pct)} filled)`).join(', ')} on every new case so next month's report is complete.`);
  const today=fmtDate(isoToday());
  return {
    title: R.total? `${inrShort(K.billed)} billed across ${K.cases.toLocaleString('en-IN')} homecare cases` : `${K.cases.toLocaleString('en-IN')} homecare cases`,
    sub: `${period} · ${K.patients} patients${D.applyFilters?' · filtered view':''} · Prepared ${today}`,
    plainSub: `${period} · ${K.patients} patients · Prepared ${today}`,
    curKey: partial? cur : null, kpis, points:pts, actions:acts,
    foot: `Source: ${t.name}, ${K.cases} cases. Months are by case start date${D.noMonth?` (${D.noMonth} cases without a date are in totals but not in monthly figures)`:''}. ${partial?`${mname(partial)} is still in progress. `:''}Amounts are as billed to patients.`
  };
}
const stripTags=h=>String(h).replace(/<[^>]+>/g,'').replace(/&amp;/g,'&').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&quot;/g,'"').replace(/&#39;/g,"'");

/* Dashboard sheet for the Excel export */
function addDashSheet(wb){
  const t=dashSource(); const D=computeDash(t,S.dash.applyFilters); const K=D.kpi,R=D.R;
  if(!D.rows.length) return;
  const ws=wb.addWorksheet('Dashboard',{views:[{showGridLines:false}]});
  ws.columns=[{width:38},{width:14},{width:14},{width:18},{width:18},{width:18},{width:16}];
  const NAVY='FF1F3864', PALE='FFEEF2F8';
  const title=ws.addRow([`Jaslok Homecare Dashboard: ${t.name}`]); title.font={bold:true,size:16,color:{argb:NAVY}};
  const section=(name)=>{ ws.addRow([]); const r=ws.addRow([name]); r.font={bold:true,size:12,color:{argb:NAVY}}; r.getCell(1).border={bottom:{style:'thin',color:{argb:NAVY}}}; };
  const header=(cols)=>{ const r=ws.addRow(cols); r.eachCell(c=>{ c.font={bold:true,color:{argb:'FFFFFFFF'}}; c.fill={type:'pattern',pattern:'solid',fgColor:{argb:NAVY}}; }); };
  const money=(r,idxs)=>idxs.forEach(i=>{ r.getCell(i).numFmt='"₹"#,##0'; });
  const zebra=(r,i)=>{ if(i%2) r.eachCell({includeEmpty:true},c=>c.fill={type:'pattern',pattern:'solid',fgColor:{argb:PALE}}); };
  const H=headline(D);
  ws.addRow([H.title]).font={bold:true,size:13};
  ws.addRow([`${H.plainSub}${D.applyFilters?' · filtered view':''}`]).font={italic:true,color:{argb:'FF666666'}};
  ws.addRow([]);
  const hk=ws.addRow(H.kpis.map(k=>k.label)); hk.eachCell(c=>{ c.font={bold:true,color:{argb:'FF666666'},size:9}; });
  const hv=ws.addRow(H.kpis.map(k=>k.value)); hv.eachCell(c=>{ c.font={bold:true,size:15,color:{argb:NAVY}}; });
  const hs=ws.addRow(H.kpis.map(k=>stripTags(k.sub))); hs.eachCell(c=>{ c.font={size:9,color:{argb:'FF444444'}}; c.alignment={wrapText:true,vertical:'top'}; }); hs.height=30;
  const wrapRow=(txt,opts={})=>{ const r=ws.addRow([txt]); ws.mergeCells(r.number,1,r.number,7); r.getCell(1).alignment={wrapText:true,vertical:'top'}; r.height=Math.max(16,Math.ceil(txt.length/105)*15); Object.assign(r.getCell(1),opts); return r; };
  section('What the numbers say'); H.points.forEach((p,i)=>wrapRow(`${i+1}. ${stripTags(p)}`));
  if(H.actions.length){ section('Needs a decision'); H.actions.forEach(a=>wrapRow(`• ${stripTags(a)}`,{font:{color:{argb:'FF9A3412'}}})); }
  wrapRow(H.foot,{font:{italic:true,size:9,color:{argb:'FF777777'}}});
  section('Key figures'); header(['Measure','Value']);
  const kp=[['Cases',K.cases],['Unique patients',K.patients]];
  if(R.total) kp.push(['Total billed (₹)',K.billed],['Average bill per case (₹)',K.avgBill?Math.round(K.avgBill):null]);
  if(R.days) kp.push(['Patient-days served',K.days],['Average days per case',K.avgDays?+K.avgDays.toFixed(1):null],['Median days per case',K.medDays]);
  if(R.end) kp.push(['Running now',K.running],['Past end date, not closed',K.overdue]);
  if(D.C.caseType) kp.push(['Renewals',K.nRen],['New cases',K.nNew],['Renewal share',K.renewShare]);
  if(R.status) kp.push(['Demise cases',K.demise]);
  kp.forEach((k,i)=>{ const r=ws.addRow(k); zebra(r,i); if(/₹/.test(k[0])) money(r,[2]); if(k[0]==='Renewal share') r.getCell(2).numFmt='0%'; });
  if(D.months.length){ section('By month (case start)'); header(['Month','Cases','Billed (₹)']); D.months.forEach((m,i)=>{ const r=ws.addRow([monthLabel(m.key),m.cases,m.billed]); money(r,[3]); zebra(r,i); }); if(D.noMonth) ws.addRow([`${D.noMonth} cases without a start date or month`]).font={italic:true,color:{argb:'FF666666'}}; }
  if(D.services.length){ section('By service'); header(['Service','Cases','Days','Billed (₹)','Avg rate/day (₹)','Share of billing']);
    D.services.slice().sort((a,b)=>b.billed-a.billed).forEach((s,i)=>{ const r=ws.addRow([s.key,s.cases,s.days,s.billed,s.avgRate?Math.round(s.avgRate):null,K.billed?s.billed/K.billed:0]); money(r,[4,5]); r.getCell(6).numFmt='0.0%'; zebra(r,i); }); }
  if(D.doctors.length){ section('By referring doctor'); header(['Doctor','Cases','Days','Billed (₹)']);
    D.doctors.slice().sort((a,b)=>b.billed-a.billed).forEach((s,i)=>{ const r=ws.addRow([s.key,s.cases,s.days,s.billed]); money(r,[4]); zebra(r,i); }); }
  if(D.statuses.length){ section('By status'); header(['Status','Cases','Billed (₹)']); D.statuses.slice().sort((a,b)=>b.cases-a.cases).forEach((s,i)=>{ const r=ws.addRow([s.key,s.cases,s.billed]); money(r,[3]); zebra(r,i); }); }
  if(D.localities.length){ section('By locality'); header(['Locality','Cases','Billed (₹)']); D.localities.slice().sort((a,b)=>b.cases-a.cases).forEach((s,i)=>{ const r=ws.addRow([s.key,s.cases,s.billed]); money(r,[3]); zebra(r,i); }); }
  if(D.overdue.length||D.endingSoon.length){ section('Needs attention'); header(['Patient','Service','End date','Status']);
    [...D.overdue.map(o=>[o,`Overdue ${-o.left} days`]),...D.endingSoon.map(o=>[o,o.left===0?'Ends today':`${o.left} days left`])].forEach(([o,s],i)=>{ const r=ws.addRow([rawStr(o.r.cells[R.name]),rawStr(o.r.cells[D.C.service]),fmtDate(o.r.cells[R.end]),s]); zebra(r,i); if(/Overdue/.test(s)) r.getCell(4).font={bold:true,color:{argb:'FFB42318'}}; }); }
  if(D.checked){ section(`Billing check: ${D.mism.length} of ${D.checked} cases where Total ≠ Days × Rate`); header(['Patient','Service','Days','Rate (₹)','Expected (₹)','Billed (₹)','Difference (₹)']);
    D.mism.forEach((m,i)=>{ const r=ws.addRow([rawStr(m.r.cells[R.name]),rawStr(m.r.cells[D.C.service]),num(m.r.cells[R.days]),num(m.r.cells[R.rate]),m.exp,m.T,m.diff]); money(r,[4,5,6,7]); zebra(r,i); if(m.diff<0) r.getCell(7).font={color:{argb:'FFB42318'}}; }); }
  section('Data completeness'); header(['Tag','Filled','Share']);
  D.completeness.forEach((c,i)=>{ const r=ws.addRow([c.key,c.filled,c.pct]); r.getCell(3).numFmt='0%'; zebra(r,i); if(c.pct<0.5) r.getCell(3).font={bold:true,color:{argb:'FFB42318'}}; });
}

/* ---------------- Settings tab ---------------- */

  closeDrawer(); renderDock();
  const s=S.settings; const cols=allColumns();
  $('#boardWrap').innerHTML=`<div class="page"><div class="page-inner">
    <h1>Settings</h1><p class="lead">Stored only in this browser on this device. Nothing here is sent to us or to GitHub.</p>

    <h2>API keys &amp; connections</h2>

      <div class="field"><div class="lbl">Ola Maps API key<small>Primary geocoder for localities and addresses. Free tier from the Ola Maps developer console.</small></div>

    <div class="panel">
      <div class="field"><div class="lbl">Google Sheets sync URL <span class="phase">Phase 2</span><small>Apps Script web-app URL that the Sheet owner deploys. Saved now; two-way sync comes in the next build.</small></div>
        <div class="keyrow"><input type="password" id="s-sheetsUrl" value="${esc(s.sheetsUrl)}" placeholder="https://script.google.com/macros/s/…/exec" autocomplete="off"><button class="btn sm" data-reveal="s-sheetsUrl">Show</button></div></div>

    <h2>Billing &amp; dates</h2>
